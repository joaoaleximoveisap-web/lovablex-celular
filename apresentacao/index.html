<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apresentação</title>
<meta name="description" content="Apresentação interativa protegida por senha.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#110f0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="marca/icone-180.png">
<link rel="icon" href="marca/icone.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Apresentação">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,wght@0,400;1,400&family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mesmo visual do Palco: quente e escuro, como uma sala de apresentação com a luz apagada. */
:root {
  --bg: #110f0d; --bg2: #1a1714; --panel: #1f1b17; --line: rgba(244, 239, 233, .12); --line2: rgba(244, 239, 233, .2);
  --ink: #f4efe9; --mute: #a59a90; --accent: #c9a27e; --accent-ink: #1a1512; --red: #e0826b;
  --ui: rgba(24, 21, 18, .8);
  --f-ui: Figtree, Inter, system-ui, sans-serif; --f-disp: Fraunces, Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--f-ui); -webkit-font-smoothing: antialiased; }
body { overscroll-behavior: none; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------------- tela de senha ---------------- */
.porta { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); overflow-y: auto;
  background: radial-gradient(120% 90% at 50% 30%, #2a231c 0%, var(--bg) 62%, #0a0908 100%); }
.porta-cx { width: min(400px, 100%); display: grid; gap: 22px; text-align: center; }
.torre { width: 64px; height: 64px; margin: 0 auto; display: block; }
.porta h1 { margin: 0; font-family: var(--f-disp); font-weight: 400; font-size: clamp(30px, 8vw, 42px); line-height: 1.08; letter-spacing: -.01em; }
.porta h1 em { color: var(--accent); }
.porta .sub { margin: 8px 0 0; color: var(--mute); font-size: 15px; }
.porta form { display: grid; gap: 12px; text-align: left; }
.campo { position: relative; }
.campo input { width: 100%; height: 54px; border-radius: 14px; border: 1px solid var(--line2); background: rgba(255, 255, 255, .04); padding: 0 52px 0 18px; font-size: 17px; letter-spacing: .02em; }
.campo input:focus { outline: none; border-color: var(--accent); background: rgba(255, 255, 255, .06); }
.campo button { position: absolute; right: 6px; top: 6px; width: 42px; height: 42px; border: 0; background: none; border-radius: 10px; color: var(--mute); display: grid; place-items: center; }
.lembrar { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--mute); cursor: pointer; padding: 2px 4px; }
.lembrar input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.entrar { height: 54px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; transition: filter .2s; }
.entrar:hover { filter: brightness(1.08); }
.entrar:disabled { opacity: .6; cursor: default; }
.erro { margin: 0; color: var(--red); font-size: 14px; text-align: center; min-height: 20px; }
.carga { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.carga i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.carga-txt { margin: -4px 0 0; font-size: 13px; color: var(--mute); text-align: center; }
.rodape { font-size: 12px; color: rgba(165, 154, 144, .7); }
.rodape a { color: var(--mute); }
@keyframes tremer { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); } 30%, 50%, 70% { transform: translateX(-4px); } 40%, 60% { transform: translateX(4px); } }
.tremer { animation: tremer .45s both; }

.instalar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 60; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 18px; background: rgba(31, 27, 23, .97); border: 1px solid rgba(201, 162, 126, .45); box-shadow: 0 16px 40px rgba(0, 0, 0, .5); font-size: 14px; color: #d8cfc6; max-width: 520px; margin: 0 auto; }
.instalar img { border-radius: 10px; flex: none; }
.instalar span { flex: 1; } .instalar b { color: var(--ink); }
.instalar .bt { border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 9px 14px; }
.instalar .x { border: 0; background: none; color: var(--mute); font-size: 22px; line-height: 1; padding: 4px 6px; }

/* ---------------- palco (copiado de src/styles.css do Palco) ---------------- */
.palco { position: fixed; inset: 0; background: var(--bg); }
.stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; background: radial-gradient(120% 90% at 50% 40%, #231e19 0%, var(--bg) 60%, #0a0908 100%); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.stage.dragging { cursor: grabbing; }
.slot-lite { overflow: hidden; }
.slot-lite .sl { pointer-events: none; }
.slot-lite img { user-select: none; -webkit-user-drag: none; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.world.moving { will-change: transform; }
.floor { position: absolute; pointer-events: none; }
.flabel { position: absolute; text-align: right; white-space: nowrap; transition: opacity .8s; }
.floor.jornada .flabel { text-align: left; }
.flabel b { display: block; font-weight: 200; line-height: .9; color: rgba(244, 239, 233, .9); font-family: Inter, var(--f-ui); }
.flabel.row { display: flex; gap: .6em; align-items: baseline; text-align: left; }
.flabel.row b, .flabel.row span { display: inline; font-size: 1em; line-height: 1; font-weight: 600; }
.flabel.row b { color: var(--accent); }
.flabel.row span { color: rgba(244, 239, 233, .75); }
.flabel span { display: block; font-weight: 500; text-transform: uppercase; color: var(--accent); font-family: Inter, var(--f-ui); }
.slab { position: absolute; display: block; background: linear-gradient(90deg, transparent, rgba(201, 162, 126, .38) 12%, rgba(201, 162, 126, .38) 88%, transparent); }
.mullion { position: absolute; background: linear-gradient(180deg, transparent, rgba(201, 162, 126, .35) 6%, rgba(201, 162, 126, .35) 94%, transparent); pointer-events: none; }
.slot { position: absolute; transition: opacity .8s ease; }
.slot.active { box-shadow: 0 30px 90px rgba(0, 0, 0, .55); }
.stage.present { transition: background-color .5s ease; }
.stage.present.filled { background: var(--fillbg, #000); }
.stage.present.filled .slot.active { box-shadow: none; }
.stage.present.filled .world:not(.moving) > :not(.active) { opacity: 0 !important; transition: opacity .4s ease; }
.stage.dim .slot:not(.active) { opacity: var(--dimop, .26); }
.stage.dim .flabel { opacity: .45; }
.sl { position: relative; overflow: hidden; color: #000; font-family: Inter, system-ui, sans-serif; line-height: 1.2; }
.sl .bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ly { position: absolute; }
.ly > .in { position: absolute; inset: 0; }
.geo { position: absolute; inset: 0; width: 100%; height: 100%; }
.ln { position: absolute; left: 0; top: 0; display: block; }
.media { position: absolute; inset: 0; overflow: hidden; }
.media img, .media video { display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.tx { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: visible; white-space: pre-wrap; word-wrap: break-word; }
.tx.a-ctr { justify-content: center; }
.tx.a-b { justify-content: flex-end; }
.tx.nw { white-space: pre; }
.tx.vt { writing-mode: vertical-rl; }
.tx p { min-height: 1em; }
.tx > div { margin-right: -5%; }
.tx p.c { margin-left: -5% !important; }
.tx p.r { margin-left: -5% !important; margin-right: 5% !important; }
.tb { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; }
.tb td { overflow: hidden; }

/* animações de entrada (o slide ativo recebe .play) */
.slot.play .ly[data-anim] > .in { animation-duration: calc(var(--t, .9) * var(--as, 1) * 1s); animation-delay: calc(var(--d, 0) * var(--as, 1) * 1s); animation-fill-mode: both; animation-timing-function: cubic-bezier(.2, .7, .2, 1); }
.slot.play .ly[data-anim="rise"] > .in, .slot.play .ly[data-anim="count"] > .in { animation-name: pl-rise; }
.slot.play .ly[data-anim="count"] > .in { animation-duration: calc(.6 * var(--as, 1) * 1s); }
.slot.play .ly[data-anim="fade"] > .in { animation-name: pl-fade; animation-timing-function: ease; }
.slot.play .ly[data-anim="scale"] > .in { animation-name: pl-scale; animation-timing-function: cubic-bezier(.3, 1.5, .5, 1); }
.slot.play .ly[data-anim="blur"] > .in { animation-name: pl-blur; }
.slot.play .ly[data-anim="draw"] path.draw { stroke-dasharray: 1; animation: pl-draw calc(var(--t, 1.8) * var(--as, 1) * 1s) cubic-bezier(.45, 0, .25, 1) calc(var(--d, 0) * var(--as, 1) * 1s) both; }
@keyframes pl-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.slot.play .ly[data-anim="draw"]:not([data-drawpath]) > .in { animation-name: pl-wipe; animation-timing-function: cubic-bezier(.45, 0, .25, 1); }
@keyframes pl-wipe { from { clip-path: inset(-50% 100% -50% -50%); } to { clip-path: inset(-50% -50% -50% -50%); } }
.slot.play .ly[data-anim="grow"] > .in { animation-name: pl-grow-h; transform-origin: 0 50%; }
.slot.play .ly[data-anim="grow"][data-grow="v"] > .in { animation-name: pl-grow-v; transform-origin: 50% 100%; }
.slot.play .ly[data-anim="none"] > .in { animation: none; }
.slot.arm .ly[data-anim]:not([data-anim="none"]) > .in { opacity: 0; }
@keyframes pl-rise { from { opacity: 0; transform: translateY(var(--rise, 26px)); } to { opacity: 1; transform: none; } }
@keyframes pl-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pl-scale { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes pl-blur { from { opacity: 0; filter: blur(14px); } to { opacity: 1; filter: none; } }
@keyframes pl-grow-h { from { transform: scaleX(0); } to { transform: none; } }
@keyframes pl-grow-v { from { transform: scaleY(0); } to { transform: none; } }
.slot.active .kbimg { animation: pl-kb 16s ease-out both; }
@keyframes pl-kb { from { transform: scale(1); } to { transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) {
  .slot.play .ly > .in, .slot.active .kbimg { animation: none !important; }
  .slot.play .ly[data-anim="draw"] path.draw { animation: none; stroke-dasharray: none; }
  .stage.k-pilha .slot { animation: none !important; }
}
.stage.present .slot.active .ly[data-click]:not(.shown) > .in { opacity: 0 !important; animation: none !important; }
.stage.present .slot.active .ly[data-click].shown[data-anim="none"] > .in { animation: none; }
.stage.present .ly[data-link] { cursor: pointer; }

.stage.t-claro { background: radial-gradient(110% 90% at 50% 40%, #fbf9f6 0%, #efebe4 70%, #e4ded5 100%); }
.stage.t-preto { background: #000; }
.stage.t-grafite { background: radial-gradient(120% 90% at 50% 40%, #262a30 0%, #15171b 65%, #0d0e10 100%); }
.stage.t-claro .slot.active { box-shadow: 0 18px 50px rgba(60, 45, 30, .16); }
.stage.t-claro .flabel.row span { color: #6f655c; }
.stage.t-claro .flabel.row b { color: #a07a55; }
.stage.t-preto .slot { box-shadow: none; }
.stage.nokb .kbimg { animation: none !important; }
.stage.k-pilha .slot.active { z-index: 2; }
.stage.present.k-pilha .slot:not(.active):not(.leaving) { visibility: hidden; }
.stage.morph .slot { transition: left .75s cubic-bezier(.2, .7, .2, 1), top .75s cubic-bezier(.2, .7, .2, 1), opacity .9s ease, filter .9s ease; }
/* trocas sem câmera (formato pilha): empurrar como no PowerPoint e mergulho imersivo */
.stage.k-pilha.tr-push .slot, .stage.k-pilha.tr-mergulho .slot { transition: none !important; }
.stage.k-pilha.tr-push .slot.leaving, .stage.k-pilha.tr-mergulho .slot.leaving { opacity: 1 !important; filter: none !important; z-index: 1; }
.stage.k-pilha.tr-push .slot.active { animation: tr-push-in .7s cubic-bezier(.65, 0, .35, 1) both; }
.stage.k-pilha.tr-push .slot.leaving { animation: tr-push-out .7s cubic-bezier(.65, 0, .35, 1) both; }
.stage.k-pilha.tr-push[data-dir="prev"] .slot.active { animation-name: tr-push-in-r; }
.stage.k-pilha.tr-push[data-dir="prev"] .slot.leaving { animation-name: tr-push-out-r; }
@keyframes tr-push-in { from { transform: translateX(100%); } to { transform: none; } }
@keyframes tr-push-out { from { transform: none; } to { transform: translateX(-100%); } }
@keyframes tr-push-in-r { from { transform: translateX(-100%); } to { transform: none; } }
@keyframes tr-push-out-r { from { transform: none; } to { transform: translateX(100%); } }
.stage.k-pilha.tr-mergulho .slot { overflow: hidden; box-shadow: none; }
.stage.k-pilha.tr-mergulho .slot > div { transform-origin: 50% 50% !important; }
.stage.k-pilha.tr-mergulho .slot.active { z-index: 2; animation: tr-fade-in 1.15s cubic-bezier(.33, 0, .2, 1) both; }
.stage.k-pilha.tr-mergulho .slot.active > div { animation: tr-dive-in 1.15s cubic-bezier(.33, 0, .2, 1) both; }
.stage.k-pilha.tr-mergulho .slot.leaving { z-index: 1; opacity: 1 !important; }
.stage.k-pilha.tr-mergulho .slot.leaving > div { animation: tr-dive-out 1.15s cubic-bezier(.33, 0, .2, 1) both; }
.stage.k-pilha.tr-mergulho[data-dir="prev"] .slot.active > div { animation-name: tr-dive-in-r; }
.stage.k-pilha.tr-mergulho[data-dir="prev"] .slot.leaving > div { animation-name: tr-dive-out-r; }
@keyframes tr-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes tr-dive-in { from { transform: scale(1.08); } to { transform: scale(1); } }
@keyframes tr-dive-out { from { transform: scale(1); } to { transform: scale(1.12); } }
@keyframes tr-dive-in-r { from { transform: scale(1.12); } to { transform: scale(1); } }
@keyframes tr-dive-out-r { from { transform: scale(1); } to { transform: scale(1.04); } }

/* controles: aparecem com o mouse na borda de baixo ou segurando o dedo na tela */
.pui { position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0; transition: opacity .35s; }
.pui > * { pointer-events: none !important; }
.palco.ui .pui { opacity: 1; }
.palco.ui .pui > * { pointer-events: auto !important; }
.palco.ui .pui > .prog { pointer-events: none !important; }
.palco.still .stage { cursor: none; }
.bar { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 6px; border-radius: 999px; background: var(--ui); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: 0 10px 40px rgba(0, 0, 0, .4); max-width: calc(100vw - 24px); }
.bar button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; flex-shrink: 0; }
.bar button:hover, .bar button.on { background: rgba(255, 255, 255, .1); }
.bar .fx { width: auto; padding: 0 12px; border-radius: 999px; gap: 6px; display: flex; align-items: center; font-size: 13px; color: var(--accent); border: 1px solid rgba(201, 162, 126, .5); }
.info { display: flex; align-items: baseline; gap: 8px; padding: 0 10px; min-width: 0; cursor: pointer; font-variant-numeric: tabular-nums; }
.info .num { font-weight: 600; font-size: 15px; }
.info .tot, .info .ttl, .timer { color: var(--mute); font-size: 13px; }
.info .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.timer { padding: 0 12px 0 6px; font-variant-numeric: tabular-nums; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; flex-shrink: 0; }
.back { position: absolute; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); border: 1px solid var(--line); background: var(--ui); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 999px; padding: 9px 16px; font-size: 13px; }
.prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .06); }
.prog i { display: block; height: 100%; background: var(--accent); transition: width .6s ease; }
.elev { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; max-height: 80vh; overflow: auto; }
.elev button { display: flex; align-items: center; justify-content: flex-end; gap: 10px; border: 0; background: none; padding: 2px 0; color: var(--mute); }
.elev em { font-style: normal; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; opacity: 0; transform: translateX(6px); transition: .25s; white-space: nowrap; }
.elev b { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 500; background: var(--ui); transition: .25s; flex-shrink: 0; }
.elev:hover em, .elev button.on em { opacity: 1; transform: none; }
.elev button.on { color: var(--ink); }
.elev button.on b { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.modes-pop { position: absolute; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(360px, calc(100vw - 24px)); max-height: calc(100dvh - 120px); overflow-y: auto; background: rgba(24, 21, 18, .96); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 16px; padding: 8px; display: grid; gap: 2px; }
.modes-pop p { margin: 4px 8px 6px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.modes-pop button { display: grid; text-align: left; gap: 2px; border: 1px solid transparent; background: none; border-radius: 10px; padding: 9px 12px; }
.modes-pop button:hover { background: rgba(255, 255, 255, .06); }
.modes-pop button.on { border-color: var(--accent); background: rgba(201, 162, 126, .1); }
.modes-pop b { font-size: 14px; font-weight: 600; }
.modes-pop span { font-size: 12px; color: var(--mute); }
.toast { position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ui); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; font-size: 14px; z-index: 50; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); max-width: min(680px, calc(100vw - 32px)); text-align: center; pointer-events: none; }
.black { position: fixed; inset: 0; background: #000; z-index: 20; }
.help { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(0, 0, 0, .6); padding: 16px; }
.help .card { background: #1b1714; border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px; max-width: 100%; }
.help h3 { margin: 0 0 12px; font-weight: 500; }
.help td { padding: 5px 14px 5px 0; color: var(--mute); font-size: 14px; }
.help td:first-child { color: var(--ink); white-space: nowrap; }
kbd { font-family: inherit; font-size: 12px; border: 1px solid var(--line2); border-radius: 5px; padding: 1px 6px; }
@media (max-width: 700px) {
  .elev { right: 8px; gap: 4px; } .elev b { width: 28px; height: 28px; font-size: 11px; } .elev em { display: none; }
  .info .ttl, .timer, .bar .sep.s1 { display: none; } .bar button { width: 36px; height: 36px; }
  .bar .fx .fxn { display: none; } .bar .fx { padding: 0 10px; }
}
</style>
</head>
<body>

<section class="porta" id="porta">
  <div class="porta-cx">
    <div>
      <svg class="torre" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="6" width="52" height="52" rx="14" fill="#1f1b17" stroke="rgba(201,162,126,.5)"/><g fill="#c9a27e"><rect x="18" y="40" width="28" height="8" rx="1.5"/><rect x="21" y="29" width="22" height="8" rx="1.5" opacity=".8"/><rect x="24" y="18" width="16" height="8" rx="1.5" opacity=".6"/></g></svg>
    </div>
    <div>
      <h1 id="portaTitulo">Apresentação</h1>
      <p class="sub">Digite a senha para abrir.</p>
    </div>
    <form id="form" autocomplete="off">
      <div class="campo">
        <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" aria-label="Senha" required>
        <button type="button" id="ver" aria-label="Mostrar senha" title="Mostrar senha"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <label class="lembrar"><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
      <button class="entrar" id="entrar" type="submit">Abrir apresentação</button>

    const { project, url } = await abrir(bytes, senha, (f, t) => progresso(0.85 + f * 0.15, t));
    guardar(CHAVE_SENHA, lembrar ? senha : null);
    porta.hidden = true;
    apresentar(project, url);
  } catch (e) {
    semProgresso();
    if (e.senha && automatico) { guardar(CHAVE_SENHA, null); erro.textContent = "A senha mudou. Digite a nova senha."; }
    else erro.textContent = e.message || "Não foi possível abrir.";
    if (e.senha) { form.classList.remove("tremer"); void form.offsetWidth; form.classList.add("tremer"); campo.select(); }
    $("#entrar").disabled = false; $("#entrar").textContent = "Abrir apresentação";
  }
}
form.addEventListener("submit", e => { e.preventDefault(); if (campo.value) entrar(campo.value, $("#lembrar").checked, false); });
$("#ver").onclick = () => { campo.type = campo.type === "password" ? "text" : "password"; campo.focus(); };

(async () => {
  try { versao = await lerVersao(); }
  catch { erro.textContent = "Sem internet e sem cópia guardada neste aparelho."; $("#entrar").disabled = true; return; }
  $("#portaTitulo").textContent = versao.titulo || "Apresentação";
  document.title = versao.titulo || "Apresentação";
  $("#rodape").textContent = "Arquivo protegido · " + mb(versao.bytes || 0);
  const salva = lido(CHAVE_SENHA);
  if (salva) entrar(salva, true, true);
  else setTimeout(() => campo.focus(), 50);
})();

/* =====================================================================
   Apresentação (Presenter.tsx + Stage.tsx)
   ===================================================================== */
const ICON = {
  left: "M15 5l-7 7 7 7", right: "M9 5l7 7-7 7", grid: "M4 4h6.5v6.5H4zM13.5 4H20v6.5h-6.5zM4 13.5h6.5V20H4zM13.5 13.5H20V20h-6.5z",
  expand: "M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5", shrink: "M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5",
  spark: "M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6",
  lock: "M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3", help: "M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01",
};
const icon = (n, s = 20) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[n]}"/></svg>`;
const nativeFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFullscreen() {
  if (nativeFs()) { const x = document.exitFullscreen || document.webkitExitFullscreen; if (x) Promise.resolve(x.call(document)).catch(() => {}); return; }
  const de = document.documentElement, rq = de.requestFullscreen || de.webkitRequestFullscreen;
  if (rq) try { Promise.resolve(rq.call(de)).catch(() => say("Este navegador não deixa entrar em tela cheia. No iPhone, instale na Tela de Início.")); } catch {}
  else say("No iPhone, a tela cheia vem de Compartilhar → Adicionar à Tela de Início.");
}
let say = () => {};

function apresentar(project, url) {
  loadFonts(project.fonts || []);
  const W = project.w, H = project.h, order = pathSlides(project).map(s => s.id);
  const slideById = new Map(project.slides.map(s => [s.id, s]));
  const phone = innerWidth <= 700, tablet = !phone && navigator.maxTouchPoints > 0 && innerWidth <= 1300;
  const perfil = phone ? { detail: 2, preview: 8 } : tablet ? { detail: 3, preview: 12 } : { detail: 5, preview: 22 };
  let modo = modeById(lido(CHAVE_MODO) || DEFAULT_MODE);
  let grid = false, eng = null, layout = null, steps = [], idx = 0, ui = false, modesOpen = false, curSlide = order[0];
  const slots = new Map();
  const since = Date.now();

  const root = el("div", "palco present");
  const stage = el("div", "stage present"), world = el("div", "world");
  stage.appendChild(world);
  const pui = el("div", "pui"); pui.dataset.ui = "";
  pui.innerHTML = `
    <nav class="elev" id="elev"></nav>
    <button class="back" id="voltar" hidden>↺ Voltar ao roteiro</button>
    <div class="modes-pop" id="modos" hidden><p>Efeito da apresentação</p></div>
    <div class="bar">
      <button id="bTrancar" title="Trancar (esquece a senha neste aparelho)" aria-label="Trancar">${icon("lock")}</button>
      <span class="sep s1"></span>
      <button id="bAnt" title="Anterior (←)" aria-label="Anterior">${icon("left")}</button>
      <div class="info" id="info" title="Centralizar slide atual"><span class="num" id="iNum"></span><span class="tot" id="iTot"></span><span class="ttl" id="iTtl"></span></div>
      <button id="bProx" title="Próximo (→ ou espaço)" aria-label="Próximo">${icon("right")}</button>
      <span class="sep"></span>
      <button id="bGeral" title="Visão geral (O)" aria-label="Visão geral">${icon("grid")}</button>
      <button class="fx" id="bFx" title="Trocar o efeito (M)">${icon("spark", 16)} <span class="fxn" id="fxNome"></span></button>
      <button id="bTela" title="Tela cheia (F)" aria-label="Tela cheia">${icon("expand")}</button>
      <button id="bAjuda" title="Atalhos (?)" aria-label="Atalhos">${icon("help")}</button>
      <span class="timer" id="relogio">00:00</span>
    </div>
    <div class="prog"><i id="progBarra"></i></div>`;
  const toast = el("div", "toast"); toast.hidden = true;
  const black = el("div", "black"); black.hidden = true;
  const help = el("div", "help"); help.hidden = true;
  help.innerHTML = `<div class="card"><h3>Como navegar</h3><table><tbody>
    <tr><td>toque · <kbd>→</kbd> <kbd>espaço</kbd></td><td>próximo</td></tr>
    <tr><td>deslizar · <kbd>←</kbd></td><td>anterior</td></tr>
    <tr><td>pinça · roda do mouse</td><td>zoom livre</td></tr>
    <tr><td>segurar o dedo na tela</td><td>mostra os controles</td></tr>
    <tr><td><kbd>O</kbd></td><td>visão geral</td></tr>
    <tr><td><kbd>M</kbd></td><td>trocar o efeito</td></tr>
    <tr><td><kbd>F</kbd></td><td>tela cheia</td></tr>
    <tr><td><kbd>B</kbd></td><td>tela preta</td></tr>
    <tr><td><kbd>1</kbd><kbd>2</kbd> <kbd>↵</kbd></td><td>ir para o slide 12</td></tr>
    <tr><td><kbd>Esc</kbd></td><td>voltar ao roteiro</td></tr></tbody></table></div>`;
  root.append(stage, pui, toast, black, help);
  document.body.appendChild(root);
  const q = s => root.querySelector(s);

  let toastT = 0;
  say = m => { toast.textContent = m; toast.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (toast.hidden = true), 2600); };

  // controles: mouse na borda de baixo/direita, ou segurar o dedo na tela
  let uiT = 0, pressT = 0, stillT = 0, longPress = false;
  const setUi = v => { ui = v; root.classList.toggle("ui", ui || modesOpen); };
  const showUi = (ms = 0) => { setUi(true); clearTimeout(uiT); if (ms) uiT = setTimeout(() => setUi(false), ms); };
  addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") { clearTimeout(pressT); return; }
    root.classList.remove("still"); clearTimeout(stillT); stillT = setTimeout(() => root.classList.add("still"), 2000);
    const over = e.target.closest && e.target.closest("[data-ui]");
    if (over || e.clientY > innerHeight - 120 || e.clientX > innerWidth - 150) showUi();
    else { clearTimeout(uiT); uiT = setTimeout(() => setUi(false), 700); }
  });
  addEventListener("pointerdown", e => {
    longPress = false;
    if (e.pointerType === "mouse" || (e.target.closest && e.target.closest("[data-ui]"))) return;
    clearTimeout(pressT);
    pressT = setTimeout(() => { longPress = true; showUi(5000); }, 550);
  }, true);
  addEventListener("pointerup", () => clearTimeout(pressT), true);
  setInterval(() => { if (!document.hidden) { const s = Math.floor((Date.now() - since) / 1000); q("#relogio").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); } }, 1000);

  const kindNow = () => modo.layout === "pilha" && grid ? "grade" : modo.layout;

  /** Desenha completo só o slide atual e os vizinhos; os outros visíveis, em miniatura. */
  function setSlot(id, state) {
    const s = slots.get(id);
    if (!s || s.state === state) return;
    s.state = state;
    s.inner.replaceChildren();
    s.el.classList.toggle("slot-lite", state !== "full");
    const sl = slideById.get(id);
    if (state === "full") s.inner.appendChild(slideEl(sl, W, H, url));
    else if (state === "lite") s.inner.appendChild(liteEl(sl, W, H, url));
    if (state === "full" && s.el.classList.contains("active")) s.el.querySelectorAll('video[data-auto="1"]').forEach(v => { if (v.paused && !document.hidden) v.play().catch(() => {}); });
  }
  function refreshNear() {
    if (!eng) return;
    const detail = new Set(), preview = new Set();
    const st = eng.steps[Math.max(0, eng.idx)];
    if (kindNow() === "pilha") {
      const i = Math.max(0, order.indexOf(st && st.slide));
      order.slice(Math.max(0, i - 1), i + 2).forEach(id => detail.add(id));
    } else {
      const pr = new Map(), c = Math.max(0, eng.idx), rad = perfil.detail <= 3 ? 1 : 2;
      for (let k = Math.max(0, c - rad); k <= Math.min(eng.steps.length - 1, c + rad); k++) {
        const s = eng.steps[k];
        if (s && s.slide && !s.overview) pr.set(s.slide, Math.min(pr.has(s.slide) ? pr.get(s.slide) : Infinity, Math.abs(k - c)));
      }
      const view = eng.view(), ppu = eng.pxPerUnit(), vis = [];
      for (const [id, r] of layout.slides) {
        if (r.x >= view.x + view.w || r.x + r.w <= view.x || r.y >= view.y + view.h || r.y + r.h <= view.y) continue;
        const pix = r.w * ppu;
        if (pix > 35) vis.push({ id, pix });
        if (pix > 250) pr.set(id, Math.min(pr.has(id) ? pr.get(id) : Infinity, 3));
      }
      [...pr].sort((a, b) => a[1] - b[1]).slice(0, perfil.detail).forEach(([id]) => detail.add(id));
      for (const v of vis.sort((a, b) => b.pix - a.pix)) { if (preview.size >= perfil.preview) break; if (!detail.has(v.id)) preview.add(v.id); }
    }
    if (eng.active) detail.add(eng.active.dataset.slide);
    for (const id of slots.keys()) setSlot(id, detail.has(id) ? "full" : preview.has(id) ? "lite" : "");
  }
  // tela cheia de verdade: parado num slide, as sobras ganham a cor do fundo do slide
  function fillBars() {
    const st = eng && eng.steps[eng.idx];
    const s = st && st.slide && !st.overview && !eng.ovToggle && !eng.free ? slideById.get(st.slide) : null;
    stage.classList.toggle("filled", !!s);
    if (s) stage.style.setProperty("--fillbg", s.bgAsset && !s.bg ? "#000" : s.bg || "#fff");
  }

  function montar() {
    const kind = kindNow();
    layout = layoutProject(project, kind);
    steps = buildSteps(project, layout, modo.layout !== "pilha");
    const dim = modo.layout === "pilha" ? !grid : modo.dimOp < 1;
    stage.className = "stage present k-" + kind + " t-" + modo.theme + " tr-" + modo.tr + (dim ? " dim" : "") + (modo.kb ? "" : " nokb") + (modo.layout === "pilha" ? " morph" : "");
    stage.style.setProperty("--dimop", modo.dimOp);
    stage.style.setProperty("--rise", modo.rise + "px");
    world.replaceChildren(); slots.clear();
    const u = layout.unit;
    if (kind === "torre" && modo.labels && layout.floors.length) {
      const top = Math.min(...layout.floors.map(f => f.y)), bottom = Math.max(...layout.floors.map(f => f.y + f.h));
      const x2 = layout.floors[0].x + layout.floors[0].w;
      for (const x of [-u * 0.09, x2 + u * 0.08]) world.appendChild(el("div", "mullion", { left: x + "px", top: top - u * 0.3 + "px", height: bottom - top + u * 0.5 + "px", width: u * 0.008 + "px" }));
    }
    if (kind !== "pilha" && modo.labels) for (const f of layout.floors) {
      const fl = el("div", "floor " + kind, { left: f.x + "px", top: f.y + "px", width: f.w + "px", height: f.h + "px" });
      const lb = el("div", "flabel" + (kind === "torre" ? "" : " row"));
      const b = el("b"), sp = el("span");
      b.textContent = f.num; sp.textContent = f.name;
      if (kind === "torre") {
        Object.assign(lb.style, { right: `calc(100% + ${u * 0.13}px)`, top: "0" });
        b.style.fontSize = u * 0.22 + "px";
        Object.assign(sp.style, { fontSize: u * 0.05 + "px", marginTop: u * 0.02 + "px", letterSpacing: u * 0.016 + "px" });
      } else Object.assign(lb.style, { left: "0", bottom: `calc(100% + ${u * 0.035}px)`, fontSize: u * 0.04 + "px", letterSpacing: u * 0.012 + "px" });
      lb.append(b, sp); fl.appendChild(lb);
      if (kind === "torre") fl.appendChild(el("i", "slab", { left: -u * 0.8 + "px", right: -u * 0.22 + "px", bottom: -u * 0.13 + "px", height: u * 0.008 + "px" }));
      world.appendChild(fl);
    }
    for (const id of order) {
      const r = layout.slides.get(id);
      if (!r) continue;
      const s = el("div", "slot slot-lite", { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" });
      s.dataset.slide = id;
      const inner = el("div", "", { width: W + "px", height: H + "px", transform: `scale(${r.sc})`, transformOrigin: "0 0" });
      s.appendChild(inner); world.appendChild(s);
      slots.set(id, { el: s, inner, state: "" });
    }
    // elevador de andares
    const elev = q("#elev");
    elev.replaceChildren();
    elev.hidden = kind === "pilha";
    for (const f of [...layout.floors].reverse()) {
      const b = el("button"); b.dataset.floor = f.id; b.title = f.name;
      const em = el("em"), bb = el("b"); em.textContent = f.name; bb.textContent = f.num;
      b.append(em, bb);
      b.onclick = () => { const i = steps.findIndex(s => s.floor === f.id && !s.overview); if (i >= 0) eng.go(i); };
      elev.appendChild(b);
    }
    q("#fxNome").textContent = modo.name;
  }

  function atualizar(i) {
    idx = i;
    const st = steps[i];
    if (st && st.slide) curSlide = st.slide;
    const ov = eng.ovToggle || (st && st.overview) || grid;
    q("#iNum").textContent = ov ? "—" : String(order.indexOf(st && st.slide) + 1).padStart(2, "0");
    q("#iTot").textContent = "/ " + String(order.length).padStart(2, "0");
    const s = st && st.slide && slideById.get(st.slide);
    q("#iTtl").textContent = ov ? "Visão geral" : ((s && s.title) || "") + (st && st.focus ? " · detalhe" : "");
    q("#progBarra").style.width = (steps.length > 1 ? (i / (steps.length - 1)) * 100 : 0) + "%";
    root.querySelectorAll("#elev button").forEach(b => b.classList.toggle("on", !!st && st.floor === b.dataset.floor && !st.overview));
    // na grade da visão geral, escolher um slide volta para o efeito
    if (grid && !eng.ovToggle) { grid = false; reconstruir(false); return; }
    refreshNear(); fillBars();
  }

  eng = new Engine(stage, world, {
    speed: () => 1,
    animSpeed: () => modo.animSpeed,
    motion: () => ({ move: modo.move, rho: modo.rho, dur: modo.dur, ease: modo.ease }),
    onChange: i => atualizar(i),
    onFree: f => { q("#voltar").hidden = !f; fillBars(); },
    onSettle: () => refreshNear(),
    ensure: id => setSlot(id, "full"),
    swallow: () => longPress,
  });

  function reconstruir(paraGrade) {
    eng.stopNumbers(); eng.active = null;
    montar();
    eng.setSteps(steps, layout.ov);
    const i = Math.max(0, steps.findIndex(s => s.slide === curSlide && !s.focus));
    if (paraGrade) { eng.idx = i; eng.ovToggle = false; eng.overview(); return; }
    eng.go(i, true);
  }
  function overview() {
    if (modo.layout === "pilha") { grid = !grid; reconstruir(grid); return; }
    eng.overview();
  }
  function trocarModo(id) {
    modo = modeById(id);
    guardar(CHAVE_MODO, modo.id);
    grid = false;
    reconstruir(false);
    abrirModos(false);
    say("Efeito " + modo.name);
  }
  const pop = q("#modos");
  for (const m of MODES) {
    const b = el("button"); b.dataset.id = m.id;
    b.innerHTML = `<b>${m.name}</b><span>${m.para}</span>`;
    b.onclick = () => trocarModo(m.id);
    pop.appendChild(b);
  }
  function abrirModos(v) {
    modesOpen = v; pop.hidden = !v;
    pop.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.id === modo.id));
    q("#bFx").classList.toggle("on", v);
    root.classList.toggle("ui", ui || modesOpen);
    if (v) showUi();
  }

  q("#bAnt").onclick = () => (grid ? overview() : eng.prev());
  q("#bProx").onclick = () => (grid ? overview() : eng.next());
  q("#info").onclick = () => (grid ? overview() : eng.go(eng.idx));
  q("#bGeral").onclick = overview;
  q("#bFx").onclick = () => abrirModos(!modesOpen);
  q("#bTela").onclick = () => { toggleFullscreen(); showUi(3500); };
  q("#bAjuda").onclick = () => (help.hidden = false);
  q("#voltar").onclick = () => eng.go(eng.idx);
  q("#bTrancar").onclick = () => { guardar(CHAVE_SENHA, null); location.reload(); };
  help.onclick = () => (help.hidden = true);
  black.onclick = () => (black.hidden = true);
  const fsIcon = () => { q("#bTela").innerHTML = icon(nativeFs() ? "shrink" : "expand"); };
  document.addEventListener("fullscreenchange", fsIcon);
  document.addEventListener("webkitfullscreenchange", fsIcon);

  let digits = "", digitsT = 0;
  addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (!black.hidden) { black.hidden = true; e.preventDefault(); return; }
    if (!help.hidden && k !== "?") { help.hidden = true; return; }
    if (modesOpen && k === "Escape") { abrirModos(false); return; }
    if (/^\d$/.test(k)) { digits += k; say("Ir para o slide " + digits + " ↵"); clearTimeout(digitsT); digitsT = setTimeout(() => (digits = ""), 2500); return; }
    if (k === "Enter" && digits) {
      const id = order[+digits - 1]; digits = "";
      if (id) { if (grid) { grid = false; curSlide = id; reconstruir(false); } else eng.goSlide(id); } else say("Slide não encontrado");
      return;
    }
    const go = f => () => { if (grid) { overview(); return; } f(); };
    const map = {
      ArrowRight: go(() => eng.next()), ArrowDown: go(() => eng.next()), PageDown: go(() => eng.next()), " ": go(() => eng.next()), Enter: go(() => eng.next()),
      ArrowLeft: go(() => eng.prev()), ArrowUp: go(() => eng.prev()), PageUp: go(() => eng.prev()), Backspace: go(() => eng.prev()),
      Home: go(() => eng.go(0)), End: go(() => eng.go(steps.length - 1)),
      f: toggleFullscreen, F: toggleFullscreen, o: overview, O: overview,
      m: () => abrirModos(!modesOpen), M: () => abrirModos(!modesOpen),
      Escape: () => { if (grid) overview(); else if (eng.ovToggle || eng.free) eng.go(eng.idx); },
      b: () => (black.hidden = false), B: () => (black.hidden = false), ".": () => (black.hidden = false),
      "?": () => (help.hidden = !help.hidden), h: () => (help.hidden = !help.hidden),
    };
    if (map[k]) { e.preventDefault(); map[k](); }
  });

  montar();
  eng.setSteps(steps, layout.ov);
  eng.cam = eng.fit(layout.ov, 1.02); eng.apply();
  requestAnimationFrame(() => eng.go(0));
  showUi(4000);
  setTimeout(() => say(innerHeight > innerWidth * 1.1
    ? "Gire o celular para ver os slides maiores · toque para avançar"
    : "Toque ou use as setas para avançar · segure o dedo na tela para ver os controles"), 700);
  document.getElementById("instalar").hidden = true;
}

/* ---------- instalar na tela de início (igual ao DEMANDA X) ---------- */
let pedidoInstalar = null;
const instalado = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); pedidoInstalar = e; mostrarInstalar(); });
function mostrarInstalar() {
  if (instalado() || porta.hidden) return;
  if (lido("apresentacao.instalar.fechado")) return;
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (!ios && !pedidoInstalar) return;
  $("#instalar").hidden = false;
  $("#instalarTxt").innerHTML = ios
    ? `Para usar como app: toque em <b>Compartilhar</b> <span aria-hidden="true">⬆︎</span> e depois em <b>Adicionar à Tela de Início</b>.`
    : `Coloque a apresentação na tela de início, como um app.`;
  $("#instalarBt").hidden = ios;
}
$("#instalarBt").onclick = async () => { if (!pedidoInstalar) return; pedidoInstalar.prompt(); await pedidoInstalar.userChoice.catch(() => {}); pedidoInstalar = null; $("#instalar").hidden = true; };
$("#instalarX").onclick = () => { $("#instalar").hidden = true; guardar("apresentacao.instalar.fechado", "1"); };
setTimeout(mostrarInstalar, 1500);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

<!doctype html>
<html lang="pt-BR" data-letra="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impossible Man</title>
<meta name="description" content="O consultor de imagem do Lucas Chacon no seu celular: roupa, cabelo, barba, cuidados e presença.">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Impossible">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="marca/icone.svg">
<link rel="icon" href="marca/icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Feito para qualquer idade: letra grande, áreas de toque generosas, uma decisão
     por tela, navegação sempre à vista embaixo e "Voltar" no topo das telas internas. */
  :root {
    --fundo: #f4f0e8; --cartao: #fffdf9; --tom: #ebe4d7; --tom-2: #e3dacb;
    --texto: #161513; --suave: #5b564e; --linha: #e2d9ca;
    --marca: #161513; --marca-txt: #f6f1e8; --marca-suave: #c9c1b4;
    --acento: #a94c1a; --acento-fundo: #f5e3d4;
    --ok: #2c6646; --ok-fundo: #e1efe5; --alerta: #94440f; --alerta-fundo: #f8e6d6;
    --sombra: 0 1px 2px rgba(22,21,19,.05), 0 10px 28px rgba(22,21,19,.07);
    --raio: 22px; --abas: 78px;
    --serifa: "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fundo: #0f0e0d; --cartao: #1b1a18; --tom: #26241f; --tom-2: #2f2c27;
      --texto: #f4efe6; --suave: #bab3a7; --linha: #302d28;
      --marca: #f4efe6; --marca-txt: #0f0e0d; --marca-suave: #4a463f;
      --acento: #ef9257; --acento-fundo: #3a2416; --ok: #8fd1aa; --ok-fundo: #173323; --alerta: #f3b483; --alerta-fundo: #3d2616;
      --sombra: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --fundo: #0f0e0d; --cartao: #1b1a18; --tom: #26241f; --tom-2: #2f2c27;
    --texto: #f4efe6; --suave: #bab3a7; --linha: #302d28;
    --marca: #f4efe6; --marca-txt: #0f0e0d; --marca-suave: #4a463f;
    --acento: #ef9257; --acento-fundo: #3a2416; --ok: #8fd1aa; --ok-fundo: #173323; --alerta: #f3b483; --alerta-fundo: #3d2616;
    --sombra: 0 1px 2px rgba(0,0,0,.4);
  }
  html[data-letra="1"] { font-size: 17px; }
  html[data-letra="2"] { font-size: 19px; }
  html[data-letra="3"] { font-size: 23px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto); overflow-x: hidden; }
  body { font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
  [hidden] { display: none !important; }
  img { max-width: 100%; display: block; }
  h1, h2, h3, p { margin: 0; }
  .i { flex: none; display: block; }
  :focus-visible { outline: 3px solid var(--acento); outline-offset: 3px; border-radius: 12px; }

  .app { max-width: 560px; margin: 0 auto; min-height: 100dvh; padding-top: env(safe-area-inset-top); }
  .tela { min-height: 100dvh; display: flex; flex-direction: column; }
  .tela.com-abas { padding-bottom: calc(var(--abas) + env(safe-area-inset-bottom) + 24px); }
  .anima-avanca { animation: daDireita .32s cubic-bezier(.2,.8,.2,1); }
  .anima-volta { animation: daEsquerda .32s cubic-bezier(.2,.8,.2,1); }
  .anima-aba { animation: surge .25s ease; }
  @keyframes daDireita { from { transform: translateX(28px); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes daEsquerda { from { transform: translateX(-28px); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes surge { from { opacity: .3; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .anima-avanca, .anima-volta, .anima-aba, .digitando i { animation: none !important; } }

  /* topo das telas */
  .cabeca { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: color-mix(in srgb, var(--fundo) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .cabeca h1 { flex: 1; min-width: 0; font-size: 1.05rem; font-weight: 600; line-height: 1.25; }
  .voltar { display: flex; align-items: center; gap: 4px; min-height: 52px; padding: 0 16px 0 10px; border-radius: 999px;
    background: var(--cartao); box-shadow: var(--sombra); font-weight: 600; font-size: .95rem; }
  .cabeca-raiz { padding: 22px 20px 6px; display: flex; align-items: center; gap: 14px; }
  .cabeca-raiz .textos { flex: 1; min-width: 0; }
  .cabeca-raiz h1 { font-family: var(--serifa); font-size: 1.9rem; line-height: 1.1; font-weight: 600; }
  .cabeca-raiz p { color: var(--suave); font-size: .9rem; margin-top: 4px; }

  .conteudo { flex: 1; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 16px; }
  .sobre { font-size: .72rem; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; color: var(--acento); }
  .suave { color: var(--suave); }
  .centro { text-align: center; }
  .titulo { font-family: var(--serifa); font-size: 1.55rem; line-height: 1.15; font-weight: 600; }
  .secao { font-family: var(--serifa); font-size: 1.3rem; font-weight: 600; margin: 10px 4px -4px; }

  /* cards */
  .card { background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); padding: 20px; display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .card h3 { font-size: 1.08rem; font-weight: 600; line-height: 1.3; }
  .card.escuro { background: var(--marca); color: var(--marca-txt); }
  .card.escuro .sobre { color: var(--acento); }
  .card.acento { background: var(--acento-fundo); box-shadow: none; }
  .card.ok { background: var(--ok-fundo); box-shadow: none; }
  .card.atencao { background: var(--alerta-fundo); box-shadow: none; }
  button.card { transition: transform .15s ease; }
  button.card:active, .btn:active, .item:active, .opcao:active, .aba:active { transform: scale(.98); }

  .circulo { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: var(--tom); color: var(--texto); flex: none; }
  .circulo.acento { background: var(--acento); color: #fff; }
  .circulo.pequeno { width: 46px; height: 46px; border-radius: 14px; }
  .atalho-grande { flex-direction: row; align-items: center; gap: 16px; padding: 18px; min-height: 96px; }
  .atalho-grande .texto, .item .texto { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .atalho-grande b { font-size: 1.08rem; line-height: 1.3; }
  .atalho-grande small, .atalho small, .item small { color: var(--suave); font-size: .86rem; line-height: 1.35; }
  .grade-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grade-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .atalho { gap: 12px; padding: 18px; min-height: 150px; justify-content: flex-start; }
  .atalho b { font-size: 1rem; line-height: 1.25; }

  /* lista dentro de um card */
  .lista { padding: 6px; gap: 0; }
  .item { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 10px 12px; border-radius: 16px; }
  .item + .item { border-top: 1px solid var(--linha); border-radius: 0 0 16px 16px; }
  .item b { font-weight: 600; font-size: 1rem; line-height: 1.3; }
  .item .seta { color: var(--suave); }

  /* olá */
  .ola { display: flex; align-items: flex-start; gap: 12px; padding: 18px 4px 4px; }
  .ola > div { flex: 1; }
  .data { color: var(--suave); font-size: .9rem; }
  .titulo-grande { font-family: var(--serifa); font-size: 2.05rem; line-height: 1.08; font-weight: 600; margin-top: 4px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--marca); color: var(--marca-txt); display: grid; place-items: center;
    font-family: var(--serifa); font-size: 1.4rem; font-weight: 600; flex: none; }

  /* look do dia */
  .destaque-look { gap: 14px; padding: 22px; text-align: left; }
  .mini-quadro { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .mini-tile { aspect-ratio: 1; border-radius: 16px; background: rgba(255,255,255,.08); display: grid; place-items: center; overflow: hidden; }
  .mini-tile img { width: 100%; height: 100%; object-fit: cover; }
  .frase-look { font-family: var(--serifa); font-size: 1.25rem; line-height: 1.3; }
  .link-claro { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--marca-txt); opacity: .9; }

  /* desenhos e fotos das peças */
  .roupa { width: 82%; height: 82%; }
  .tile { aspect-ratio: 1; background: var(--tom); border-radius: 18px; display: grid; place-items: center; overflow: hidden; }
  .tile img { width: 100%; height: 100%; object-fit: cover; }
  .tile.grande { border-radius: var(--raio); }
  .peca { background: var(--cartao); border-radius: 20px; box-shadow: var(--sombra); padding: 8px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .peca .nome { padding: 0 6px 6px; font-weight: 600; font-size: .9rem; line-height: 1.25; }
  .pecas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .quadro { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile-look { background: var(--cartao); border-radius: 20px; box-shadow: var(--sombra); padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .tile-look .legenda { padding: 0 6px 8px; display: flex; flex-direction: column; gap: 4px; }
  .tile-look small { color: var(--suave); font-size: .75rem; text-transform: uppercase; letter-spacing: 1px; }
  .tile-look b { font-size: .95rem; line-height: 1.25; }
  .tile-look.falta .tile { background: repeating-linear-gradient(135deg, var(--tom) 0 10px, var(--tom-2) 10px 20px); }
  .chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: .75rem; font-weight: 600; background: var(--tom); }
  .chip-ok { background: var(--ok-fundo); color: var(--ok); }
  .chip-acento { background: var(--acento-fundo); color: var(--acento); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips .chip { font-size: .85rem; padding: 8px 14px; }

  /* botões */
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 64px; padding: 12px 20px;
    border-radius: 18px; font-weight: 600; font-size: 1.02rem; background: var(--marca); color: var(--marca-txt); text-align: center; }
  .btn.claro { background: var(--cartao); color: var(--texto); box-shadow: inset 0 0 0 2px var(--linha); }
  .btn.acento { background: var(--acento); color: #fff; }
  .btn[disabled] { opacity: .5; }
  .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .acoes .btn { font-size: .95rem; padding: 10px 12px; gap: 8px; }
  .btn-texto { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--acento); min-height: 44px; }
  .btn-ouvir { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 999px; background: var(--tom); font-weight: 600; font-size: .9rem; flex: none; }
  .linha-titulo { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  /* veredito */
  .veredito { flex-direction: row; align-items: flex-start; gap: 14px; }
  .veredito .marcador { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--cartao); }
  .veredito h2 { font-family: var(--serifa); font-size: 1.6rem; line-height: 1.15; font-weight: 600; margin-top: 2px; }
  .veredito.ok .marcador { color: var(--ok); } .veredito.acento .marcador { color: var(--acento); } .veredito.atencao .marcador { color: var(--alerta); }
  .foto { width: 100%; max-height: 46vh; object-fit: contain; border-radius: 18px; background: var(--tom); }

  /* escolhas (perguntas e tipos de roupa) */
  .progresso { height: 6px; border-radius: 6px; background: var(--tom); overflow: hidden; }
  .progresso span { display: block; height: 100%; background: var(--acento); border-radius: 6px; transition: width .3s ease; }
  .escolhas { display: flex; flex-direction: column; gap: 10px; }
  .opcao { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 14px 18px; border-radius: 18px;
    background: var(--cartao); box-shadow: var(--sombra); text-align: left; }
  .opcao .texto { flex: 1; display: flex; flex-direction: column; }
  .opcao b { font-weight: 600; font-size: 1.02rem; line-height: 1.3; }
  .opcao small { color: var(--suave); font-size: .85rem; }
  .opcao .marca-opcao { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--linha); display: grid; place-items: center; flex: none; color: #fff; }
  .opcao.marcada { box-shadow: inset 0 0 0 2px var(--acento), var(--sombra); }
  .opcao.marcada .marca-opcao { background: var(--acento); box-shadow: none; }
  .opcao-peca { background: var(--cartao); border-radius: 20px; box-shadow: var(--sombra); padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; text-align: center; }
  .opcao-peca b { font-size: .85rem; line-height: 1.2; font-weight: 600; padding: 0 4px; }
  .opcao-peca.marcada { box-shadow: inset 0 0 0 3px var(--acento), var(--sombra); }
  .opcao-cor { background: var(--cartao); border-radius: 18px; box-shadow: var(--sombra); padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-height: 112px; }
  .opcao-cor b { font-size: .8rem; line-height: 1.2; font-weight: 600; }
  .opcao-cor.marcada { box-shadow: inset 0 0 0 3px var(--acento), var(--sombra); }
  .amostra { width: 48px; height: 48px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .sugerido { flex-direction: row; align-items: center; gap: 14px; }
  .sugerido .tile { width: 92px; flex: none; }

  /* conversa */
  .conversa { display: flex; flex-direction: column; gap: 14px; padding-bottom: 150px; }
  .msg { display: flex; gap: 10px; align-items: flex-end; max-width: 92%; }
  .msg.eu { align-self: flex-end; }
  .selo { width: 38px; height: 38px; border-radius: 50%; background: var(--marca); color: var(--marca-txt); display: grid; place-items: center;
    font-family: var(--serifa); font-style: italic; font-weight: 600; font-size: .85rem; flex: none; }
  .bolha { padding: 14px 16px; border-radius: 22px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
  .msg.ia .bolha { background: var(--cartao); box-shadow: var(--sombra); border-bottom-left-radius: 8px; }
  .msg.eu .bolha { background: var(--marca); color: var(--marca-txt); border-bottom-right-radius: 8px; }
  .bolha img { border-radius: 14px; margin-bottom: 8px; max-height: 220px; }
  .bolha .btn-ouvir { margin-top: 10px; }
  .digitando { display: inline-flex; gap: 5px; padding: 6px 2px; }
  .digitando i { width: 8px; height: 8px; border-radius: 50%; background: var(--suave); animation: pula 1.2s infinite ease-in-out; }
  .digitando i:nth-child(2) { animation-delay: .15s; } .digitando i:nth-child(3) { animation-delay: .3s; }
  @keyframes pula { 0%, 60%, 100% { transform: none; opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }
  .escrever { position: fixed; left: 0; right: 0; bottom: calc(var(--abas) + env(safe-area-inset-bottom)); z-index: 7; max-width: 560px; margin: 0 auto;
    padding: 10px 16px; background: color-mix(in srgb, var(--fundo) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; flex-direction: column; gap: 8px; }
  .campo-msg { display: flex; align-items: flex-end; gap: 8px; background: var(--cartao); border-radius: 24px; box-shadow: var(--sombra); padding: 6px 6px 6px 18px; }
  .campo-msg textarea { flex: 1; border: 0; background: transparent; resize: none; min-height: 48px; max-height: 140px; padding: 12px 0; font-size: 1rem; outline: none; }
  .enviar { width: 52px; height: 52px; border-radius: 50%; background: var(--acento); color: #fff; display: grid; place-items: center; flex: none; }
  .extras { display: flex; gap: 8px; }
  .extras button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 999px; background: var(--cartao); box-shadow: var(--sombra); font-weight: 600; font-size: .9rem; }

  /* barra de navegação */
  .abas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--cartao); border-top: 1px solid var(--linha); box-shadow: 0 -6px 24px rgba(22,21,19,.06); }
  .aba { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 66px; border-radius: 16px; color: var(--suave); font-size: .74rem; font-weight: 600; position: relative; }
  .aba.ativa { color: var(--texto); }
  .aba.ativa::before { content: ""; position: absolute; top: 2px; width: 28px; height: 3px; border-radius: 3px; background: var(--acento); }

  /* outros */
  .manifesto { background: var(--marca); color: var(--marca-txt); border-radius: var(--raio); padding: 24px 22px; }
  .frase { font-family: var(--serifa); font-size: 1.22rem; line-height: 1.38; font-style: italic; }
  .traco { width: 44px; height: 3px; background: var(--acento); margin: 14px 0 10px; border-radius: 2px; }
  .assina { font-size: .72rem; letter-spacing: 2.4px; text-transform: uppercase; opacity: .75; }
  .boas-vindas { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; padding: 32px 20px calc(28px + env(safe-area-inset-bottom)); }
  .marca-nome { font-family: var(--serifa); font-size: 2.6rem; line-height: 1; font-style: italic; font-weight: 600; letter-spacing: -.5px; }
  .marca-por { font-size: .78rem; letter-spacing: 3px; text-transform: uppercase; color: var(--suave); margin-top: 10px; }
  .monograma { width: 72px; height: 72px; border-radius: 22px; background: var(--marca); color: var(--marca-txt); display: grid; place-items: center;
    font-family: var(--serifa); font-style: italic; font-size: 1.6rem; font-weight: 600; margin-bottom: 22px; }
  .segmentos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--tom); padding: 6px; border-radius: 18px; }
  .segmentos button { min-height: 60px; border-radius: 14px; font-family: var(--serifa); font-weight: 600; }
  .segmentos button.ativo { background: var(--cartao); box-shadow: var(--sombra); }
  .carregando { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 40px 20px; }
  .roda { width: 56px; height: 56px; border-radius: 50%; border: 5px solid var(--tom); border-top-color: var(--acento); animation: gira 1s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  input[type=text], input[type=password], textarea.campo { width: 100%; min-height: 60px; padding: 14px 16px; border-radius: 16px;
    border: 0; box-shadow: inset 0 0 0 2px var(--linha); background: var(--cartao); font-size: 1.02rem; outline: none; }
  input:focus, textarea.campo:focus { box-shadow: inset 0 0 0 2px var(--acento); }
  textarea.campo { min-height: 240px; font-size: .82rem; line-height: 1.5; resize: vertical; }
  label.rotulo { font-weight: 600; display: block; margin-bottom: 6px; }
  .aviso { position: fixed; left: 16px; right: 16px; bottom: calc(var(--abas) + 16px + env(safe-area-inset-bottom)); z-index: 50; max-width: 528px; margin: 0 auto;
    display: flex; align-items: center; gap: 12px; background: var(--marca); color: var(--marca-txt); padding: 16px 18px; border-radius: 18px; font-weight: 600;
    box-shadow: 0 12px 30px rgba(0,0,0,.25); animation: surge .2s ease; }
  .aviso .i { color: var(--acento); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<input type="file" id="arquivo-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="arquivo-galeria" accept="image/*" hidden>

<script>
"use strict";

/* ===================== Catálogo: tipos de peça, cores, tons de pele ===================== */

// formal: faixa de formalidade em que a peça funciona (1 = em casa ... 5 = festa/casamento)

// Diminui a foto para caber no celular e para enviar rápido
function reduzirFoto(arquivo, lado = 720) {
  return new Promise((ok, falha) => {
    const url = URL.createObjectURL(arquivo);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, lado / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok({ grande: c.toDataURL("image/jpeg", 0.8), cor: corDominante(c) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(); };
    img.src = url;
  });
}
function miniatura(dataUrl, lado = 300) {
  return new Promise((ok) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, lado / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = () => ok(dataUrl);
    img.src = dataUrl;
  });
}
// Olha o meio da foto (onde costuma estar a roupa) e acha a cor mais próxima da nossa lista
function corDominante(canvas) {
  try {
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    const d = ctx.getImageData(Math.round(w * 0.3), Math.round(h * 0.3), Math.max(1, Math.round(w * 0.4)), Math.max(1, Math.round(h * 0.4))).data;
    const contagem = {};
    for (let i = 0; i < d.length; i += 16) {
      const k = `${d[i] >> 5},${d[i + 1] >> 5},${d[i + 2] >> 5}`;
      contagem[k] = (contagem[k] || 0) + 1;
    }
    const [melhor] = Object.entries(contagem).sort((a, b) => b[1] - a[1])[0];
    const [r, g, b] = melhor.split(",").map((n) => n * 32 + 16);
    let perto = "cinza", dist = Infinity;
    for (const [id, c] of Object.entries(CORES)) {
      if (id === "estampa") continue;
      const [cr, cg, cb] = [1, 3, 5].map((p) => parseInt(c.hex.slice(p, p + 2), 16));
      const dd = (r - cr) ** 2 * 2 + (g - cg) ** 2 * 4 + (b - cb) ** 2 * 3;
      if (dd < dist) { dist = dd; perto = id; }
    }
    return perto;
  } catch (e) { return null; }
}

    const familia = (c) => ({ branco: "claro", creme: "claro", bege: "claro", marinho: "azul", jeans: "azul", marrom: "terra", caramelo: "terra" }[c] || c);
    if (CORES[cima.cor]?.neutro && familia(cima.cor) === familia(baixo.cor)) { nota += 0.8; motivos.push("o tom sobre tom deixa o visual elegante e alonga a silhueta"); }
    else if (cima.cor === baixo.cor) nota -= 1.5;
    else if (tc !== tb) { nota += 1; motivos.push("o contraste entre a parte de cima e a de baixo deixa o visual bonito"); }
    if (cima.cor === "marinho" && baixo.cor === "preto") nota -= 1;
  }
  if (camada && camada.cor === "jeans" && baixo && baixo.cor === "jeans") nota -= 3;
  if (pes && baixo) {
    if (pes.cor === "marrom" && ["preto"].includes(baixo.cor)) nota -= 1.5;
    if (pes.cor === "preto" && ["bege", "marrom", "oliva"].includes(baixo.cor)) nota -= 1;
    if (pes.cor === "marrom" && ["marinho", "bege", "cinza", "jeans"].includes(baixo.cor)) { nota += 1; motivos.push("o calçado marrom combina muito bem com essa calça"); }
    if (pes.cor === "branco" && TIPOS[pes.tipo].nome === "Tênis") nota += 0.3;
  }
  const pele = E.perfil && PELES[E.perfil.pele];
  const rosto = camada || cima;
  if (pele && rosto) {
    if (pele.boas.includes(rosto.cor)) { nota += 1.2; motivos.push(`o ${CORES[rosto.cor].nome.toLowerCase()} perto do rosto valoriza o seu tom de pele`); }
    if (pele.evitar.includes(rosto.cor)) nota -= 1.2;
  }
  if (fortes.length === 1) motivos.push(`só uma cor forte (${CORES[fortes[0]].nome.toLowerCase()}) e o resto neutro: elegante sem exagero`);
  if (fortes.length === 0) motivos.push("as cores são neutras e combinam entre si, então não tem erro");
  nota -= pecas.filter((p) => p.sugerida).length * 2.5; // prefere o que a pessoa já tem
  return { nota, motivos };
}

function montarLooks(ocasiao) {
  const nivel = ocasiao.nivel;
  const meus = E.pecas.filter((p) => serveNaOcasiao(p, nivel));
  const sugeridas = BASICOS.filter((p) => serveNaOcasiao(p, nivel));
  const pool = (g) => {
    const m = meus.filter((p) => TIPOS[p.tipo].grupo === g);
    return m.length ? m : sugeridas.filter((p) => TIPOS[p.tipo].grupo === g);
  };
  const cimas = pool("cima"), baixos = pool("baixo"), pes = pool("pes");
  let camadas = [null];
  if (nivel >= 4) camadas = pool("camada").filter((p) => p.tipo === "blazer").concat(nivel === 5 ? [] : [null]);
  else if (nivel >= 2) camadas = [null, ...meus.filter((p) => TIPOS[p.tipo].grupo === "camada")];
  if (!camadas.length) camadas = [null];
  const looks = [];
  for (const a of cimas) for (const b of baixos) for (const c of pes) for (const d of camadas) {
    if (looks.length > 3000) break;
    if (nivel === 5 && a.tipo !== "camisa") continue;
    const pecas = [a, d, b, c].filter(Boolean);
    const { nota, motivos } = notaLook(pecas);
    looks.push({ pecas, nota: nota + Math.random() * 0.3, motivos });
  }
  looks.sort((x, y) => y.nota - x.nota);
  return looks;
}

function explicarLook(look, ocasiao) {
  const partes = [];
  const nome = primeiroNome();
  const lista = look.pecas.map((p) => nomePeca(p).toLowerCase());
  partes.push(`${nome ? nome + ", para " : "Para "}${ocasiao.nome.toLowerCase()}: ${lista.slice(0, -1).join(", ")} e ${lista.at(-1)}.`);
  if (look.motivos.length) partes.push("Por que funciona: " + look.motivos.slice(0, 2).join("; ") + ".");
  const pes = look.pecas.find((p) => TIPOS[p.tipo].grupo === "pes");
  if (pes && ["sapato", "mocassim"].includes(pes.tipo)) partes.push(`Use cinto ${CORES[pes.cor].nome.toLowerCase()}, da mesma cor do sapato.`);
  if (E.perfil?.corpo === "forte") partes.push("Dica: peças que não apertam e cores escuras alongam a silhueta.");
  if (E.perfil?.idade === "60+" && ocasiao.nivel <= 3) partes.push("Priorize o conforto: sapato macio e calça com caimento reto.");
  return partes.join(" ");
}

function avaliarPeca(peca) {
  const pele = E.perfil && PELES[E.perfil.pele];
  const grupo = TIPOS[peca.tipo].grupo;
  const pertoRosto = grupo === "cima" || grupo === "camada";
  const resultado = { pele: null, combina: [], ocasioes: [] };
  if (pele && pertoRosto) {
    if (pele.boas.includes(peca.cor)) resultado.pele = "boa";
    else if (pele.evitar.includes(peca.cor)) resultado.pele = "evitar";
    else resultado.pele = "ok";
  }
  resultado.ocasioes = OCASIOES.filter((o) => serveNaOcasiao(peca, o.nivel));
  for (const outra of E.pecas) {
    if (outra.id === peca.id || TIPOS[outra.tipo].grupo === grupo) continue;
    const { nota } = notaLook([peca, outra]);
    const servemJuntas = OCASIOES.some((o) => serveNaOcasiao(peca, o.nivel) && serveNaOcasiao(outra, o.nivel));
    if (nota >= -0.5 && servemJuntas) resultado.combina.push(outra);
  }
  let pontos = Math.min(resultado.combina.length, 4);
  if (resultado.pele === "boa") pontos += 2;
  if (resultado.pele === "evitar") pontos -= 2;
  if (CORES[peca.cor]?.neutro) pontos += 1;
  resultado.vale = E.pecas.length < 3 ? (resultado.pele === "evitar" ? "pense" : "sim") : (pontos >= 3 ? "sim" : pontos >= 1 ? "talvez" : "pense");
  return resultado;
}

function blocosMetodo() {
  return String(E.consultor.metodo || "").split(/^##\s+/m).map((b) => b.trim()).filter(Boolean).map((b) => {
    const linhas = b.split("\n");
    const titulo = linhas.shift().trim();
    let palavras = [];
    if (linhas[0] && /^palavras:/i.test(linhas[0])) palavras = linhas.shift().replace(/^palavras:/i, "").split(",").map((p) => norm(p.trim())).filter(Boolean);
    return { titulo, palavras, texto: linhas.join("\n").trim() };
  });
}
function responderSemInternet(pergunta) {
  const q = norm(pergunta);
  const ranking = blocosMetodo().map((b) => {
    let n = 0;
    for (const p of b.palavras) if (p && q.includes(p)) n += p.length > 4 ? 2 : 1;
    if (q.includes(norm(b.titulo))) n += 3;
    return { b, n };
  }).filter((x) => x.n > 0).sort((a, b) => b.n - a.n);
  if (!ranking.length) {
    return "Essa eu ainda não sei responder sem a inteligência completa ligada. Posso ajudar com: roupa para ocasiões, cores, sapato e cinto, cabelo, barba, pele, perfume, postura e estilo para cada idade. Tente perguntar de outro jeito.";
  }
  const top = ranking[0].b;
  let r = top.texto;
  if (ranking[1] && ranking[1].n >= ranking[0].n) r += "\n\n" + ranking[1].b.texto;
  const nome = primeiroNome();
  return (nome ? nome + ", " : "") + r.charAt(0).toLowerCase() + r.slice(1);
}

async function chamarClaude({ mensagens, sistema, esquema, maxTokens = 4000 }) {
  const corpo = {
    model: E.ajustes.modelo || MODELO_PADRAO,
    max_tokens: maxTokens,
    system: sistema,
    messages: mensagens,
    output_config: { effort: "low", ...(esquema ? { format: { type: "json_schema", schema: esquema } } : {}) },
    fallbacks: "default",
  };
  const cabecalhos = {
    "content-type": "application/json",
    "x-api-key": E.ajustes.chave.trim(),
    "anthropic-version": "2026-10-21",
    "anthropic-beta": "server-side-fallback-2026-07-01",
    // o app roda direto no celular, sem servidor próprio (só para a demonstração)
    "anthropic-dangerous-direct-browser-access": "true",
  };
  let r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: cabecalhos, body: JSON.stringify(corpo) });
  if (r.status === 400) {
    // se a conta não aceitar o recurso de reserva, tenta de novo sem ele
    const txt = await r.text();
    if (/fallback/i.test(txt)) {
      delete corpo.fallbacks; delete cabecalhos["anthropic-beta"];
      r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: cabecalhos, body: JSON.stringify(corpo) });
    } else throw new Error("pedido: " + txt.slice(0, 200));
  }
  if (r.status === 401 || r.status === 403) throw new Error("chave");
  if (r.status === 429) throw new Error("ocupado");
  if (!r.ok) throw new Error("http " + r.status);
  const j = await r.json();
  if (j.stop_reason === "refusal") throw new Error("recusa");
  return (j.content || []).filter((b) => b.type === "text").map((b) => b.text).join("").trim();
}
function mensagemErroIA(e) {
  const m = String(e && e.message || e);
  if (m === "chave") return "A chave da inteligência não funcionou. Peça para quem configurou o app conferir em Ajustes.";
  if (m === "ocupado") return "A inteligência está ocupada agora. Espere um minuto e tente de novo.";
  if (m === "recusa") return "Não consigo ajudar com esse pedido. Tente perguntar de outro jeito.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Parece que o celular está sem internet. Confira a conexão e tente de novo.";
  return "Algo deu errado com a inteligência. Vou responder com o que eu já sei.";
}

  cuidado: `<svg viewBox="0 0 120 120" class="roupa" aria-hidden="true"><path d="M30 52 H90 V94 Q90 100 84 100 H36 Q30 100 30 94 Z" fill="#efe6d2" stroke="#8a7e6c" stroke-width="2"/><path d="M27 36 H93 V52 H27 Z" fill="#161513" stroke="#161513" stroke-width="2" stroke-linejoin="round"/><path d="M44 70 H76 M50 80 H70" stroke="#a94c1a" stroke-width="3" stroke-linecap="round"/></svg>`,
  clube: `<svg viewBox="0 0 120 120" class="roupa" aria-hidden="true"><circle cx="60" cy="60" r="42" fill="#161513"/><circle cx="60" cy="60" r="35" fill="none" stroke="#c46a35" stroke-width="2"/><text x="60" y="71" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-style="italic" font-weight="600" font-size="30" fill="#f4efe6">IM</text></svg>`,
};
let idDesenho = 0;
function tomContorno(hex) {
  const h = hex.replace("#", "");
  const [r, g, b] = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
  const claro = (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.55;
  const f = (c) => Math.round(claro ? c * 0.62 : c + (255 - c) * 0.32);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function desenhoRoupa(tipo, cor) {
  if (PRODUTO_DESENHO[tipo]) return PRODUTO_DESENHO[tipo];
  const D = DESENHOS[tipo] || DESENHOS.camiseta;
  const listrado = cor === "estampa";
  const id = "listra" + (++idDesenho);
  const base = listrado ? "#ece6d8" : (CORES[cor]?.hex || "#a39d92");
  const s = listrado ? "#2b3b5e" : tomContorno(base);
  const defs = listrado ? `<defs><pattern id="${id}" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="#ece6d8"/><rect width="2.4" height="7" fill="#2b3b5e"/></pattern></defs>` : "";
  const botoes = (D.botoes || []).map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.8" fill="${s}"/>`).join("");
  return `<svg viewBox="0 0 120 120" class="roupa" aria-hidden="true">${defs}<g fill="${listrado ? `url(#${id})` : base}" stroke="${s}" stroke-width="2" stroke-linejoin="round">${D.corpo}</g>${D.meio ? D.meio(s) : ""}<path d="${D.detalhe || ""}" fill="none" stroke="${s}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>${botoes}</svg>`;
}
const visualPeca = (p) => p.foto ? `<img src="${p.foto}" alt="${esc(nomePeca(p))}">` : desenhoRoupa(p.tipo, p.cor);

const app = $("#app");
let pilha = [];
let tela = null;
let direcao = "";
const RAIZES = ["inicio", "armario", "conversa", "loja"];
const ABA_DA_TELA = { armario: "armario", verPeca: "armario", confirmarApagar: "armario", conversa: "conversa", loja: "loja" };
const SEM_ABAS = new Set(["boasvindas", "perfilNome", "perfilIdade", "perfilRotina", "perfilPele", "perfilCorpo", "analisando"]);
const abaDe = (t) => (t.dados && t.dados.guardar) ? "armario" : (ABA_DA_TELA[t.nome] || "inicio");

function ir(nome, dados = {}, { substituir = false } = {}) {
  pararFala();
  if (tela && !substituir) pilha.push(tela);
  tela = { nome, dados };
  direcao = "avanca";
  if (!substituir) history.pushState({ n: pilha.length }, "");
  desenhar(); window.scrollTo(0, 0);
}
function voltar() {
  pararFala();
  tela = pilha.length ? pilha.pop() : { nome: "inicio", dados: {} };
  direcao = "volta";
  desenhar(); window.scrollTo(0, 0);
}
function trocarAba(aba) {
  pararFala();
  pilha = []; tela = { nome: aba, dados: {} }; direcao = "aba";
  desenhar(); window.scrollTo(0, 0);
}
const irInicio = () => trocarAba("inicio");
// o botão "voltar" do próprio celular também volta uma tela
window.addEventListener("popstate", () => { if (pilha.length) voltar(); else if (tela && tela.nome !== "inicio" && E.perfil) irInicio(); });

function barraAbas() {
  const atual = abaDe(tela);
  const itens = [["inicio", "casa", "Início"], ["armario", "armario", "Guarda-roupa"], ["conversa", "balao", "Consultor"], ["loja", "sacola", "Loja"]];
  return `<nav class="abas" aria-label="Menu principal">${itens.map(([id, ic, nome]) =>
    `<button class="aba ${atual === id ? "ativa" : ""}" data-acao="aba" data-valor="${id}" ${atual === id ? 'aria-current="page"' : ""}>${icone(ic, 26)}<span>${nome}</span></button>`).join("")}</nav>`;
}
function cabecalho(titulo) {
  return `<header class="cabeca"><button class="voltar" data-acao="voltar">${icone("voltar", 22)}<span>Voltar</span></button><h1>${titulo}</h1></header>`;
}
function cabecalhoRaiz(titulo, sub = "", lado = "") {
  return `<header class="cabeca-raiz"><div class="textos"><h1>${titulo}</h1>${sub ? `<p>${sub}</p>` : ""}</div>${lado}</header>`;
}
function desenhar() {
  const T = TELAS[tela.nome] || TELAS.inicio;
  const abas = !SEM_ABAS.has(tela.nome);
  app.innerHTML = `<div class="tela ${direcao ? "anima-" + direcao : ""} ${abas ? "com-abas" : ""}">${T(tela.dados)}</div>${abas ? barraAbas() : ""}`;
  direcao = "";
  const foco = app.querySelector("[data-foco]");
  if (foco) foco.focus({ preventScroll: true });
  if (tela.nome === "conversa" && E.conversa.length) window.scrollTo(0, document.body.scrollHeight);
}

const dataHoje = () => { const t = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" }); return t.charAt(0).toUpperCase() + t.slice(1); };
const primeiro = (n) => String(n || "").split(" ")[0];

function ocasiaoDoDia() {
  const dia = new Date().getDay();
  if (dia === 0 || dia === 6) return OCASIOES.find((o) => o.id === "passeio");
  const rotina = E.perfil?.rotina;
  return OCASIOES.find((o) => o.id === (rotina === "escritorio" || rotina === "proprio" ? "trabalho" : "passeio"));
}
let lookGuardado = null;
function lookDoDia() {
  const oc = ocasiaoDoDia();
  const chave = oc.id + "|" + E.pecas.map((p) => p.id).join(",");
  if (!lookGuardado || lookGuardado.chave !== chave) lookGuardado = { chave, look: montarLooks(oc)[0] };
  return lookGuardado.look;
}
function dicaDoDia() {
  const blocos = blocosMetodo().filter((b) => b.texto);
  if (!blocos.length) return null;
  const hoje = Math.floor(Date.now() / 86400000);
  const b = blocos[hoje % blocos.length];
  const frases = b.texto.split(/(?<=\.)\s+/);
  let texto = frases[0];
  if (frases[1] && texto.length + frases[1].length < 170) texto += " " + frases[1];
  return { titulo: b.titulo, texto };
}

        <h3>Respostas completas</h3>
        <p>Com uma chave da API da Anthropic, o app reconhece a roupa pela foto e responde qualquer dúvida de estilo usando o método abaixo. Sem a chave, ele funciona com as regras do método.</p>

        <div><label class="rotulo" for="c-chave">Chave da API</label><input type="password" id="c-chave" autocomplete="off" placeholder="sk-ant-..." value="${esc(E.ajustes.chave)}"></div>

function textoPele(a, pele, p) {
  if (!pele || !a.pele) return "";
  const cor = CORES[p.cor].nome.toLowerCase();
  if (a.pele === "boa") return `O ${cor} valoriza a pele ${pele.nome.toLowerCase()}. Perto do rosto, deixa você com aparência mais saudável.`;
  if (a.pele === "evitar") return `O ${cor} pode deixar a pele ${pele.nome.toLowerCase()} mais apagada perto do rosto. Se gostar muito, use em peças de baixo ou com um casaco por cima. As cores que mais te valorizam: ${pele.boas.slice(0, 4).map((c) => CORES[c].nome.toLowerCase()).join(", ")}.`;
  return "É uma cor tranquila para o seu tom de pele.";
}

function bolhaHTML(m, i) {
  if (m.de === "eu") return `<div class="msg eu"><div class="bolha">${m.foto ? `<img src="${m.foto}" alt="Foto enviada">` : ""}${esc(m.texto)}</div></div>`;
  return `<div class="msg ia"><div class="selo">IM</div><div class="bolha">${esc(m.texto)}${i >= 0 ? `<br><button class="btn-ouvir" data-acao="falar-msg" data-valor="${i}">${ROTULO_OUVIR}</button>` : ""}</div></div>`;
}

/* ===================== Ações ===================== */

let rascunhoPerfil = {};
let pecaAtual = null;

const ACOES = {
  voltar, inicio: irInicio,
  aba: (v) => trocarAba(v),
  ir: (v) => ir(v),
  "perfil-comecar": () => { rascunhoPerfil = { ...(E.perfil || {}) }; ir("perfilNome", { p: rascunhoPerfil }); },
  "perfil-nome": () => { rascunhoPerfil.nome = ($("#campo-nome").value || "").trim().slice(0, 40); ir("perfilIdade", { p: rascunhoPerfil }); },
  "perfil-pular-nome": () => { rascunhoPerfil.nome = ""; ir("perfilIdade", { p: rascunhoPerfil }); },
  "perfil-idade": (v) => { rascunhoPerfil.idade = v; ir("perfilRotina", { p: rascunhoPerfil }); },
  "perfil-rotina": (v) => { rascunhoPerfil.rotina = v; ir("perfilPele", { p: rascunhoPerfil }); },
  "perfil-pele": (v) => { rascunhoPerfil.pele = v; ir("perfilCorpo", { p: rascunhoPerfil }); },
  "perfil-corpo": (v) => {
    rascunhoPerfil.corpo = v; E.perfil = rascunhoPerfil; salvar();
    irInicio(); aviso(`Tudo pronto${primeiroNome() ? ", " + primeiroNome() : ""}. Escolha por onde começar.`);
  },
  "refazer-perfil": () => { rascunhoPerfil = { ...(E.perfil || {}) }; ir("perfilNome", { p: rascunhoPerfil }); },

  // fluxo da foto: guardar = true quando vem do guarda-roupa
  "nova-peca": () => ir("foto", { guardar: true }),
  "tirar-foto": async (v) => {
    const guardar = !!tela.dados.guardar;
    const r = await pedirFoto(v);
    if (!r) return;
    pecaAtual = { id: novoId(), foto: await miniatura(r.grande), tipo: null, cor: r.cor, guardar, comentario: "" };
    if (temIA()) {
      ir("analisando", { guardar });
      try {
        const ia = await analisarFotoIA(r.grande);
        if (tela.nome !== "analisando") return;
        if (ia.e_roupa === false) aviso("Não reconheci uma roupa nessa foto. Escolha o tipo abaixo.");
        else { pecaAtual.tipo = ia.tipo; pecaAtual.cor = ia.cor; pecaAtual.comentario = guardar ? "" : ia.comentario; }
      } catch (e) {
        aviso(mensagemErroIA(e));
      }
      if (tela.nome !== "analisando") return;
      tela = { nome: "pecaTipo", dados: { ...pecaAtual, daIA: !!pecaAtual.tipo } }; direcao = "avanca"; desenhar(); window.scrollTo(0, 0);
    } else ir("pecaTipo", { ...pecaAtual });
  },
  "sem-foto": () => { pecaAtual = { id: novoId(), foto: null, tipo: null, cor: null, guardar: !!tela.dados.guardar, comentario: "" }; ir("pecaTipo", { ...pecaAtual }); },
  tipo: (v) => { pecaAtual.tipo = v; ir("pecaCor", { ...pecaAtual }); },
  cor: (v) => {
    pecaAtual.cor = v;
    const nova = { id: pecaAtual.id, tipo: pecaAtual.tipo, cor: pecaAtual.cor, foto: pecaAtual.foto };
    if (pecaAtual.guardar) {
      E.pecas.push(nova);
      if (!salvar()) { E.pecas.pop(); return; }
      trocarAba("armario");
      aviso("Roupa guardada no seu guarda-roupa.");
    } else ir("resultado", { peca: nova, comentario: pecaAtual.comentario });
  },
  "guardar-peca": () => {
    const p = tela.dados.peca;
    E.pecas.push({ id: p.id, tipo: p.tipo, cor: p.cor, foto: p.foto });
    if (!salvar()) { E.pecas.pop(); return; }
    desenhar(); aviso("Guardada no seu guarda-roupa.");
  },
  "ver-peca": (v) => ir("verPeca", { id: v }),
  "avaliar-peca": (v) => { const p = E.pecas.find((x) => x.id === v); if (p) ir("resultado", { peca: p }); },
  "apagar-peca": (v) => ir("confirmarApagar", { id: v }),
  "apagar-sim": (v) => { E.pecas = E.pecas.filter((p) => p.id !== v); salvar(); trocarAba("armario"); aviso("Roupa tirada da lista."); },

  ocasiao: (v) => {
    const oc = OCASIOES.find((o) => o.id === v);
    const looks = montarLooks(oc);
    if (!looks.length) { aviso("Não consegui montar um look. Guarde mais peças no guarda-roupa."); return; }
    ir("look", { ocasiao: oc, looks, i: 0 });
  },
  "outro-look": () => { pararFala(); tela.dados.i++; direcao = "avanca"; desenhar(); window.scrollTo(0, 0); },
  "usar-look": () => { irInicio(); aviso("Ótima escolha. Você vai ficar muito bem."); },

  falar: (v, el) => falar(el.dataset.texto || "", el),
  "falar-msg": (v, el) => { const m = E.conversa[Number(v)]; if (m) falar(m.texto, el); },

  perguntar: (v, el) => {
    if (tela.nome !== "conversa") trocarAba("conversa");
    enviarPergunta(el.dataset.texto);
  },
  enviar: () => enviarPergunta($("#pergunta").value),
  "limpar-conversa": () => { E.conversa = []; salvar(); desenhar(); window.scrollTo(0, 0); },
  microfone: (v, el) => ouvirMicrofone(el),
  "foto-conversa": async () => {
    const r = await pedirFoto("camera");
    if (!r) return;
    const texto = ($("#pergunta").value || "").trim() || "O que você acha? Me dá uma dica.";
    enviarPergunta(texto, r.grande);
  },

  comprar: (v) => {
    const p = E.consultor.produtos[Number(v)];
    if (p && p.link) window.open(p.link, "_blank", "noopener");
    else aviso("Esse produto chega em breve.");
  },

  letra: (v) => { E.ajustes.letra = Number(v); salvar(); aplicarLetra(); desenhar(); },
  "apagar-tudo-sim": () => {
    const consultor = E.consultor, chave = E.ajustes.chave;
    E = padrao(); E.consultor = consultor; E.ajustes.chave = chave; salvar(); aplicarLetra();
    pilha = []; tela = { nome: "boasvindas", dados: {} }; desenhar();
  },
  "metodo-padrao": () => { $("#c-metodo").value = METODO_PADRAO; aviso("Texto inicial colocado. Toque em Salvar."); },
  "salvar-area": () => {
    E.consultor.app = ($("#c-app").value || "").trim() || "Impossible Man";
    E.consultor.nome = ($("#c-nome").value || "").trim() || "consultor";
    E.consultor.frase = ($("#c-frase").value || "").trim();
    E.ajustes.chave = ($("#c-chave").value || "").trim();
    E.consultor.metodo = $("#c-metodo").value;
    E.consultor.produtos = $("#c-produtos").value.split("\n").map((l) => l.split("|").map((x) => x.trim())).filter((c) => c[0]).map(([nome, tipo, cor, preco, link]) => ({
      nome, tipo: TIPOS[tipo] || PRODUTO_DESENHO[tipo] ? tipo : "camiseta", cor: CORES[cor] ? cor : "cinza", preco: preco || "", link: /^https?:\/\//.test(link || "") ? link : "",
    }));
    if (salvar()) { aviso("Salvo."); voltar(); }
  },
};

app.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-acao]");
  if (!el) return;
  const f = ACOES[el.dataset.acao];
  if (f) f(el.dataset.valor, el);
});
app.addEventListener("keydown", (ev) => {
  if (ev.target.id === "campo-nome" && ev.key === "Enter") ACOES["perfil-nome"]();
});
app.addEventListener("input", (ev) => {
  // a caixa de texto cresce conforme a pessoa escreve
  if (ev.target.id === "pergunta") { ev.target.style.height = "auto"; ev.target.style.height = Math.min(ev.target.scrollHeight, 140) + "px"; }
});

/* ===================== Conversa ===================== */

let enviando = false;
async function enviarPergunta(texto, foto = null) {
  texto = String(texto || "").trim();
  if (!texto || enviando) { if (!texto) aviso("Escreva ou fale a sua dúvida primeiro."); return; }
  enviando = true;
  E.conversa.push({ de: "eu", texto });
  const conv = $("#conversa");
  const sug = $("#sugestoes"); if (sug) sug.remove();
  conv.insertAdjacentHTML("beforeend", `<div class="msg eu"><div class="bolha">${foto ? `<img src="${foto}" alt="Foto enviada">` : ""}${esc(texto)}</div></div>
    <div class="msg ia" id="pensando"><div class="selo">IM</div><div class="bolha" aria-label="Escrevendo"><span class="digitando"><i></i><i></i><i></i></span></div></div>`);
  window.scrollTo(0, document.body.scrollHeight);
  $("#pergunta").value = "";

  let resposta;
  if (temIA()) {
    try {
      const historico = E.conversa.slice(-12, -1).map((m) => ({ role: m.de === "eu" ? "user" : "assistant", content: m.texto }));
      // a conversa precisa começar com a pessoa falando
      while (historico.length && historico[0].role !== "user") historico.shift();
      const atual = foto ? [fotoParaBloco(foto), { type: "text", text: texto }] : texto;
      resposta = await chamarClaude({ sistema: instrucoesSistema(), mensagens: [...historico, { role: "user", content: atual }] });
    } catch (e) {
      resposta = mensagemErroIA(e) + (String(e.message).match(/chave|ocupado|recusa/) ? "" : "\n\n" + responderSemInternet(texto));
    }
  } else {
    await new Promise((r) => setTimeout(r, 900));
    resposta = foto ? "Para eu olhar fotos aqui na conversa, as respostas completas precisam estar ligadas na Área do consultor. Mas já te adianto uma dica:\n\n" + responderSemInternet(texto) : responderSemInternet(texto);
  }
  E.conversa.push({ de: "ia", texto: resposta || "Desculpe, não consegui responder agora." });
  if (E.conversa.length > 60) E.conversa = E.conversa.slice(-60);
  salvar();
  enviando = false;
  if (tela.nome === "conversa") {
    desenhar();
    if (E.ajustes.vozAuto) falar(resposta);
  }
}

function ouvirMicrofone(botao) {
  if (!Reconhecedor) return;
  const r = new Reconhecedor();
  r.lang = "pt-BR"; r.interimResults = false; r.maxAlternatives = 1;
  botao.innerHTML = `${icone("mic", 22)}<span>Ouvindo…</span>`; botao.disabled = true;
  r.onresult = (ev) => {
    const texto = ev.results[0][0].transcript;
    $("#pergunta").value = texto;
    enviarPergunta(texto);
  };
  r.onerror = () => aviso("Não consegui ouvir. Toque em Falar e fale perto do celular.");
  r.onend = () => { botao.innerHTML = `${icone("mic", 22)}<span>Falar</span>`; botao.disabled = false; };
  try { r.start(); } catch (e) { r.onend(); }
}

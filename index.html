<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>LovableX</title>
<meta name="theme-color" content="#0b0714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LovableX">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --fundo: #0b0714; --vidro: rgba(255,255,255,.045); --vidro2: rgba(255,255,255,.08);
    --linha: rgba(255,255,255,.09); --texto: #f5f1ff; --suave: #a79cc0; --apagado: #6f6585;
    --roxo: #8b5cf6; --rosa: #d946ef; --verde: #34d399; --amarelo: #fbbf24; --vermelho: #fb7185;
    --grad: linear-gradient(135deg, #7c3aed 0%, #c026d3 100%);
    --raio: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--fundo); color: var(--texto);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: -20% -20% auto -20%; height: 60vh; z-index: -1; pointer-events: none;
    background: radial-gradient(closest-side, rgba(139,92,246,.28), transparent 70%),
                radial-gradient(closest-side at 80% 30%, rgba(217,70,239,.18), transparent 70%); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input, textarea { font: inherit; color: var(--texto); }
  a { color: #d8b4fe; }
  [hidden] { display: none !important; }

  .app { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top); overflow-x: hidden; }
  html, body { overflow-x: hidden; }
  .tela { flex: 1; display: flex; flex-direction: column; animation: entra .28s ease; }
  /* só desliza: sem começar invisível. Se o celular pausar a animação (modo
     economia de bateria), a tela continua aparecendo em vez de ficar preta. */
  @keyframes entra { from { transform: translateY(6px); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .tela, .bolha, .aviso-toast { animation: none !important; } }

  /* topo */
  .topo { display: flex; align-items: center; gap: 12px; padding: 14px 18px 10px; position: sticky; top: 0; z-index: 5;
    background: linear-gradient(var(--fundo) 70%, transparent); }
  .topo .voltar { width: 40px; height: 40px; border-radius: 14px; background: var(--vidro2); font-size: 22px; display: grid; place-items: center; }
  .topo .nome { flex: 1; min-width: 0; }
  .topo .nome b { display: block; font-size: 19px; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topo .nome small { color: var(--suave); font-size: 13px; }
  .topo .acao { width: 40px; height: 40px; border-radius: 14px; background: var(--vidro2); display: grid; place-items: center; font-size: 17px; }

  /* boas-vindas */
  .hero { text-align: center; padding: 42px 26px 18px; }
  .hero .logo { width: 84px; height: 84px; border-radius: 26px; box-shadow: 0 18px 50px rgba(139,92,246,.45); }
  .hero h1 { font-size: 30px; letter-spacing: -.6px; margin: 22px 0 8px; line-height: 1.12; }
  .hero h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: var(--suave); margin: 0 auto; max-width: 330px; }

  .passos { padding: 10px 18px 26px; display: flex; flex-direction: column; gap: 12px; }
  .passo { background: var(--vidro); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px; }
  .passo.ativo { border-color: rgba(139,92,246,.55); box-shadow: 0 0 0 4px rgba(139,92,246,.12); }
  .passo.feito { opacity: .6; }
  .passo .cab { display: flex; align-items: center; gap: 12px; }
  .passo .num { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 14px;
    background: var(--vidro2); color: var(--suave); flex: none; }
  .passo.ativo .num { background: var(--grad); color: #fff; }
  .passo.feito .num { background: rgba(52,211,153,.18); color: var(--verde); }
  .passo h3 { margin: 0; font-size: 16px; }
  .passo p { margin: 8px 0 0 42px; color: var(--suave); font-size: 14px; }
  .passo .corpo { margin: 14px 0 0 42px; display: flex; flex-direction: column; gap: 10px; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px 18px;
    border-radius: 16px; font-weight: 650; font-size: 16px; background: var(--grad); color: #fff;
    box-shadow: 0 10px 30px rgba(139,92,246,.35); transition: transform .12s ease, opacity .2s; }
  .btn:active { transform: scale(.98); }
  .btn[disabled] { opacity: .55; }
  .btn.claro { background: var(--vidro2); box-shadow: none; }
  .btn.pequeno { padding: 11px 14px; font-size: 14px; border-radius: 13px; }
  .link { color: var(--suave); font-size: 14px; text-align: center; padding: 6px; }
  .campo { width: 100%; background: rgba(0,0,0,.25); border: 1px solid var(--linha); border-radius: 14px; padding: 13px 14px; outline: none; }
  .campo:focus { border-color: var(--roxo); }
  .erro { color: var(--vermelho); font-size: 14px; }
  .comando { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.35); border: 1px dashed var(--linha);
    border-radius: 12px; padding: 10px 12px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
  .comando span { flex: 1; }
  .comando button { color: #d8b4fe; font-size: 13px; font-family: inherit; }

  /* projetos: lista limpa, uma coluna, nada escapa da tela */
  .cabeca { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 4px; }
  .marca { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; color: var(--suave); }
  .marca img { width: 26px; height: 26px; border-radius: 8px; }
  .perfil { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: var(--vidro2); border: 1px solid var(--linha); flex: none; }
  .perfil img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ola { padding: 18px 20px 16px; }
  .ola h2 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.8px; }
  .ola p { margin: 4px 0 0; color: var(--apagado); font-size: 14px; }
  .busca { margin: 0 20px 18px; position: relative; }
  .busca input { width: 100%; background: var(--vidro); border: 1px solid var(--linha); border-radius: 14px; padding: 12px 14px 12px 40px; outline: none; font-size: 15px; }
  .busca input:focus { border-color: rgba(139,92,246,.6); }
  .busca::before { content: ""; position: absolute; left: 15px; top: 50%; width: 11px; height: 11px; transform: translateY(-60%);
    border: 2px solid var(--apagado); border-radius: 50%; }
  .busca::after { content: ""; position: absolute; left: 26px; top: 57%; width: 6px; height: 2px; background: var(--apagado); transform: rotate(45deg); }
  .grupo { margin: 0 20px 22px; }
  .grupo-titulo { display: flex; justify-content: space-between; align-items: baseline; color: var(--apagado); font-size: 12px;
    text-transform: uppercase; letter-spacing: 1px; margin: 0 4px 8px; }
  .caixa-lista { background: var(--vidro); border: 1px solid var(--linha); border-radius: 18px; overflow: hidden; }
  .linha-projeto { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 13px 14px; min-width: 0; }
  .linha-projeto + .linha-projeto { border-top: 1px solid var(--linha); }
  .linha-projeto:active { background: var(--vidro2); }
  .linha-projeto .inicial { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center;
    font-weight: 700; font-size: 16px; color: #fff; }
  .linha-projeto .textos { flex: 1; min-width: 0; }
  .linha-projeto b { display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linha-projeto small { display: block; color: var(--apagado); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linha-projeto .seta { color: var(--apagado); font-size: 20px; flex: none; }
  .selo { flex: none; font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: var(--vidro2); color: var(--suave); }
  .selo.ok { background: rgba(52,211,153,.12); color: var(--verde); }
  .selo.carregando { opacity: .4; }
  details.outros summary { list-style: none; cursor: pointer; }
  details.outros summary::-webkit-details-marker { display: none; }
  details.outros summary .grupo-titulo::after { content: "mostrar"; text-transform: none; letter-spacing: 0; color: #d8b4fe; font-size: 13px; }
  details.outros[open] summary .grupo-titulo::after { content: "esconder"; }

  /* conversas */
  .secao { padding: 4px 18px 8px; color: var(--apagado); font-size: 13px; text-transform: uppercase; letter-spacing: .8px; }
  .lista { padding: 0 18px 120px; display: flex; flex-direction: column; gap: 10px; }
  .conversa { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; background: var(--vidro);
    border: 1px solid var(--linha); border-radius: 18px; padding: 14px; }
  .conversa .bola { width: 40px; height: 40px; border-radius: 13px; background: var(--vidro2); display: grid; place-items: center; font-size: 18px; flex: none; }
  .conversa .meio { flex: 1; min-width: 0; }
  .conversa b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
  .conversa small { color: var(--apagado); font-size: 13px; }
  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom));
    width: calc(100% - 36px); max-width: 524px; z-index: 6; }
  .vazio { text-align: center; padding: 40px 30px; color: var(--suave); }
  .vazio .grande { font-size: 44px; margin-bottom: 8px; }

  /* ativação */
  .folha { margin: 0 18px 16px; background: linear-gradient(160deg, rgba(139,92,246,.16), rgba(217,70,239,.08));
    border: 1px solid rgba(139,92,246,.4); border-radius: var(--raio); padding: 18px; }
  .folha h3 { margin: 0 0 6px; font-size: 17px; }
  .folha p { margin: 0 0 14px; color: var(--suave); font-size: 14px; }
  .folha ol { margin: 0 0 14px; padding-left: 20px; color: var(--suave); font-size: 14px; }
  .folha li { margin: 6px 0; }
  .progresso { font-size: 14px; color: var(--suave); text-align: center; }

  /* chat */
  .chat { flex: 1; padding: 6px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .bolha { max-width: 84%; padding: 11px 14px; border-radius: 20px; white-space: pre-wrap; word-wrap: break-word; font-size: 15.5px; animation: entra .2s ease; }
  .bolha.eu { align-self: flex-end; background: var(--grad); color: #fff; border-bottom-right-radius: 6px; }
  .bolha.bot { align-self: flex-start; background: var(--vidro2); border: 1px solid var(--linha); border-bottom-left-radius: 6px; }
  .bolha .hora { display: block; font-size: 11px; opacity: .6; margin-top: 5px; text-align: right; }
  .bolha code { background: rgba(255,255,255,.12); padding: 1px 6px; border-radius: 6px; font-size: 13.5px; }
  .bolha.eu a { color: #fff; }
  .anexo-tag { display: inline-block; margin-top: 6px; font-size: 13px; opacity: .85; }

  .etapas { align-self: flex-start; background: var(--vidro); border: 1px solid var(--linha); border-radius: 18px; padding: 12px 14px; min-width: 240px; }
  .etapa { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 14px; color: var(--apagado); }
  .etapa i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--apagado); flex: none; font-style: normal; font-size: 11px; display: grid; place-items: center; }
  .etapa.feita { color: var(--texto); }
  .etapa.feita i { border-color: var(--verde); background: var(--verde); color: #06281c; }
  .etapa.agora { color: var(--texto); }
  .etapa.agora i { border-color: var(--amarelo); border-top-color: transparent; animation: gira 1s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }

  .sugestoes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .sugestoes button { background: var(--vidro2); border: 1px solid var(--linha); border-radius: 999px; padding: 9px 14px; font-size: 14px; }

  .compositor { position: sticky; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--fundo) 30%); }
  .anexos { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 4px 8px; }
  .anexos span { background: var(--vidro2); border-radius: 999px; padding: 6px 10px; font-size: 13px; }
  .anexos span button { color: var(--suave); margin-left: 6px; }
  .caixa { display: flex; align-items: flex-end; gap: 6px; background: var(--vidro2); border: 1px solid var(--linha); border-radius: 26px; padding: 6px; }
  .caixa textarea { flex: 1; resize: none; max-height: 150px; background: none; border: 0; outline: none; padding: 10px 6px; font-size: 16px; }
  .redondo { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 19px; color: var(--suave); }
  .redondo.enviar { background: var(--grad); color: #fff; }
  .redondo.enviar[disabled] { opacity: .45; }
  .redondo.gravando { background: var(--vermelho); color: #fff; }

  .aviso-toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 30;
    background: #221a33; border: 1px solid var(--linha); padding: 12px 16px; border-radius: 14px; font-size: 14px; max-width: 92vw;
    box-shadow: 0 12px 40px rgba(0,0,0,.5); animation: entra .2s ease; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="aviso-toast" id="toast" hidden></div>

<script type="module">
import nacl from "https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/+esm";
import { blake2b } from "https://cdn.jsdelivr.net/npm/blakejs@1.2.1/+esm";
import { selar } from "./selado.mjs";

/* =================== base =================== */
const ETIQUETA = "lovablex";
const WORKFLOW = ".github/workflows/lovablex.yml";
const LINK_TOKEN_GH = "https://github.com/settings/tokens/new?scopes=repo,workflow&description=LovableX%20Celular";
const guardar = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
const ler = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
let tokenGH = ler("lx_github") || "";
let eu = null;
let repos = [];
let pilha = [];
let pararTela = null;

const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...filhos) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const f of filhos.flat()) if (f != null && f !== false) n.append(f.nodeType ? f : document.createTextNode(String(f)));
  return n;
}
function toast(texto, ms = 2800) {
  const t = $("toast"); t.textContent = texto; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, ms);
}
const vibrar = () => { try { navigator.vibrate?.(12); } catch {} };
function quando(iso) {
  const d = new Date(iso), agora = new Date(), min = Math.round((agora - d) / 60000);
  if (min < 1) return "agora";
  if (min < 60) return `há ${min} min`;
  if (d.toDateString() === agora.toDateString()) return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}
const hora = (iso) => new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const CORES = ["#7c3aed,#c026d3", "#2563eb,#7c3aed", "#db2777,#f97316", "#059669,#2563eb", "#9333ea,#ec4899", "#0ea5e9,#22c55e"];
const corDe = (nome) => { let h = 0; for (const c of nome) h = (h * 31 + c.charCodeAt(0)) >>> 0; return CORES[h % CORES.length]; };

async function colarDaAreaDeTransferencia() {
  try { return (await navigator.clipboard.readText()).trim(); } catch { return ""; }
}

/* =================== GitHub =================== */
async function gh(caminho, { metodo = "GET", corpo, bruto = false } = {}) {
  const r = await fetch(`https://api.github.com${caminho}`, {
    method: metodo,
    headers: {
      Authorization: `Bearer ${tokenGH}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
      ...(corpo ? { "Content-Type": "application/json" } : {})
    },
    body: corpo ? JSON.stringify(corpo) : undefined, cache: "no-store"
  });
  if (bruto) return r;
  if (r.status === 204) return null;
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(dados.message || `GitHub respondeu ${r.status}`); e.status = r.status; throw e; }
  return dados;
}
const b64 = (bytes) => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(s); };
const b64texto = (t) => b64(new TextEncoder().encode(t));
const deB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

/* =================== navegação =================== */
function ir(render, { raiz = false } = {}) {
  if (pararTela) { pararTela(); pararTela = null; }
  if (raiz) pilha = [];
  pilha.push(render);
  pintar();
  window.scrollTo(0, 0);
}
function voltar() {
  if (pilha.length <= 1) return;
  if (pararTela) { pararTela(); pararTela = null; }
  pilha.pop(); pintar();
}
function pintar() {
  const app = $("app"); app.replaceChildren();
  const tela = el("div", { class: "tela" });
  app.append(tela);
  pilha[pilha.length - 1](tela);
}
function topo({ titulo, sub, voltarBtn = true, acao }) {
  return el("div", { class: "topo" },
    voltarBtn ? el("button", { class: "voltar", onclick: voltar, "aria-label": "Voltar" }, "‹") : el("img", { src: "icon-192.png", alt: "", style: "width:40px;height:40px;border-radius:13px" }),
    el("div", { class: "nome" }, el("b", {}, titulo), sub ? el("small", {}, sub) : null),
    acao || null
  );
}

/* =================== 1. boas-vindas =================== */
function telaInicio(tela) {
  const erro = el("div", { class: "erro", hidden: true });
  const manual = el("input", { class: "campo", type: "password", placeholder: "ghp_…", autocomplete: "off", hidden: true });
  const entrar = el("button", { class: "btn" }, "📋  Colar e entrar");
  // link de verdade (e não window.open): navegador de dentro de outros apps
  // (Instagram, WhatsApp, Telegram) bloqueia janela aberta por script
  const abrirGithub = el("a", { class: "btn claro", href: LINK_TOKEN_GH, target: "_blank", rel: "noopener", style: "text-decoration:none;color:#fff" }, "1. Abrir o GitHub  ↗");
  const passo1 = el("div", { class: "passo ativo" });
  const passo2 = el("div", { class: "passo" });

  abrirGithub.addEventListener("click", () => {
    vibrar();
    passo1.className = "passo feito"; passo2.className = "passo ativo";
  });

  const tentar = async (t) => {
    erro.hidden = true;
    if (!/^(ghp_|github_pat_)/.test(t)) {
      // navegador de dentro de app não deixa ler o que foi copiado: abre o campo
      // e ensina o jeito que sempre funciona (tocar e segurar → Colar)
      erro.textContent = t
        ? "Isso não parece um token do GitHub. Ele começa com ghp_"
        : "Este navegador não deixou pegar o código sozinho. Toque e segure no campo abaixo → Colar → Entrar.";
      erro.hidden = false; manual.hidden = false; manual.focus();
      entrar.textContent = "Entrar"; return;
    }
    entrar.disabled = true; entrar.textContent = "Entrando…";
    tokenGH = t;
    try {
      eu = await gh("/user");
      guardar("lx_github", t); vibrar();
      ir(telaProjetos, { raiz: true });
    } catch (e) {
      tokenGH = "";
      erro.textContent = e.status === 401 ? "O GitHub recusou esse token. Gere outro e tente de novo." : e.message;
      erro.hidden = false;
    } finally { entrar.disabled = false; if (manual.hidden) entrar.textContent = "📋  Colar e entrar"; }
  };
  manual.addEventListener("input", () => { if (/^(ghp_|github_pat_)/.test(manual.value.trim())) tentar(manual.value.trim()); });
  entrar.onclick = async () => { vibrar(); await tentar(manual.value.trim() || await colarDaAreaDeTransferencia()); };
  manual.addEventListener("keydown", (e) => { if (e.key === "Enter") tentar(manual.value.trim()); });

  passo1.append(
    el("div", { class: "cab" }, el("div", { class: "num" }, "1"), el("h3", {}, "Autorize seu GitHub")),
    el("p", {}, "Abre o GitHub já preenchido. Lá embaixo, toque em Generate token e depois em copiar 📋."),
    el("div", { class: "corpo" }, abrirGithub)
  );
  passo2.append(
    el("div", { class: "cab" }, el("div", { class: "num" }, "2"), el("h3", {}, "Volte aqui e entre")),
    el("p", {}, "O app pega o código que você copiou. Não precisa digitar nada."),

// Nome de verdade de cada app: o <title> do index.html (o mesmo da aba do
// navegador). "elyongest-web-dash-92b2ffd8" não diz nada; "CRM DAJ" diz.
const META = "lx_meta_v2";
const lerMeta = () => { try { return JSON.parse(ler(META) || "{}"); } catch { return {}; } };
async function lerArquivoBruto(repo, caminho) {
  const r = await fetch(`https://api.github.com/repos/${repo.full_name}/contents/${caminho}`, {
    headers: { Authorization: `Bearer ${tokenGH}`, Accept: "application/vnd.github.raw+json", "X-GitHub-Api-Version": "2022-11-28" }, cache: "no-store"
  });
  return r.ok ? r.text() : "";
}
const nomeBonito = (slug) => slug.replace(/-[0-9a-f]{6,}$/i, "").replace(/[-_]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()).trim();
async function identificar(repo) {
  const cache = lerMeta();
  const guardado = cache[repo.full_name];
  if (guardado && guardado.pushed === repo.pushed_at) return guardado;
  const [html, pacote] = await Promise.all([lerArquivoBruto(repo, "index.html").catch(() => ""), lerArquivoBruto(repo, "package.json").catch(() => "")]);
  let titulo = ((html.match(/<title[^>]*>([^<]*)<\/title>/i) || [])[1] || "").replace(/&amp;/g, "&").replace(/\s*[|–-]\s*Lovable.*$/i, "").trim();
  if (!titulo || /^(vite|react|lovable app|my lovable app|index)/i.test(titulo)) titulo = nomeBonito(repo.name);
  // só sinais reais do Lovable: a palavra "Lovable" no título (ex.: o próprio
  // LovableX) não faz de um repositório um projeto do Lovable
  const doLovable = /lovable-tagger/.test(pacote) || /cdn\.gpteng\.co|gptengineer|lovable\.dev\/(opengraph|projects)/i.test(html);
  const meta = { titulo, lovable: doLovable, pushed: repo.pushed_at };
  cache[repo.full_name] = meta;
  guardar(META, JSON.stringify(cache));
  return meta;
}

// versão do robô publicada junto com o app; projeto com versão velha é
// atualizado sozinho ao abrir (a pessoa não precisa fazer nada)
let roboPublicado = null;
async function textoDoRobo() {
  if (roboPublicado == null) roboPublicado = await (await fetch("./lovablex.yml", { cache: "no-store" })).text();
  return roboPublicado;
}
const versaoDe = (yml) => Number((String(yml).match(/lovablex-versao:\s*(\d+)/) || [])[1] || 1);

async function estadoDoProjeto(repo) {
  const [wf, seg, publicado] = await Promise.all([
    gh(`/repos/${repo.full_name}/contents/${WORKFLOW}`, { bruto: true }),
    gh(`/repos/${repo.full_name}/actions/secrets?per_page=100`).catch(() => ({ secrets: [] })),
    textoDoRobo().catch(() => "")
  ]);
  const nomes = (seg.secrets || []).map((s) => s.name);
  let desatualizado = false;
  if (wf.status === 200) {
    try {
      const j = await wf.json();
      const instalado = new TextDecoder().decode(deB64(String(j.content || "").replace(/\s/g, "")));
      desatualizado = Boolean(publicado) && versaoDe(instalado) < versaoDe(publicado);
    } catch {}
  }
  return {
    robo: wf.status === 200,
    chave: nomes.includes("CLAUDE_CODE_OAUTH_TOKEN") || nomes.includes("ANTHROPIC_API_KEY"),
    desatualizado
  };
}

async function ativar(repo, chaveClaude, progresso) {
  if (chaveClaude) {
    progresso("Guardando a chave do Claude com segurança…");
    const nome = /^sk-ant-oat/i.test(chaveClaude) ? "CLAUDE_CODE_OAUTH_TOKEN" : "ANTHROPIC_API_KEY";
    const pub = await gh(`/repos/${repo.full_name}/actions/secrets/public-key`);
    const selado = selar(nacl, blake2b, new TextEncoder().encode(chaveClaude), deB64(pub.key));
    await gh(`/repos/${repo.full_name}/actions/secrets/${nome}`, { metodo: "PUT", corpo: { encrypted_value: b64(selado), key_id: pub.key_id } });
  }
  progresso("Instalando o robô no projeto…");
  const yml = await (await fetch("./lovablex.yml", { cache: "no-store" })).text();
  const atual = await gh(`/repos/${repo.full_name}/contents/${WORKFLOW}`, { bruto: true });
  const sha = atual.status === 200 ? (await atual.json()).sha : undefined;
  await gh(`/repos/${repo.full_name}/contents/${WORKFLOW}`, {
    metodo: "PUT", corpo: { message: "LovableX Celular: ativar pedidos pelo celular", content: b64texto(yml), ...(sha ? { sha } : {}) }
  });
  await gh(`/repos/${repo.full_name}/labels`, { metodo: "POST", corpo: { name: ETIQUETA, color: "8b5cf6", description: "Pedido feito pelo LovableX Celular" } })
    .catch((e) => { if (e.status !== 422) throw e; });
}

function folhaAtivacao(repo, estado, depois) {
  const guardada = ler("lx_claude") || "";
  const erro = el("div", { class: "erro", hidden: true });
  const status = el("div", { class: "progresso", hidden: true });
  const botao = el("button", { class: "btn" }, guardada ? "⚡  Ativar com a chave guardada" : "📋  Colar chave e ativar");

  copiar.onclick = async () => { try { await navigator.clipboard.writeText("claude setup-token"); copiar.textContent = "copiado ✓"; } catch {} };

  botao.onclick = async () => {
    vibrar(); erro.hidden = true;
    let chave = guardada;
    if (!estado.chave && !chave) {
      chave = await colarDaAreaDeTransferencia();
      if (!/^sk-ant-/.test(chave)) { erro.textContent = "Não achei a chave copiada. Ela começa com sk-ant-"; erro.hidden = false; return; }
    }
    botao.disabled = true; status.hidden = false;
    try {
      await ativar(repo, estado.chave ? "" : chave, (m) => { status.textContent = m; });
      if (chave) guardar("lx_claude", chave);
      toast("Projeto ativado ✓ Pode pedir!"); vibrar();
      depois();
    } catch (e) {
      status.hidden = true;
      erro.textContent = [403, 404].includes(e.status)
        ? "O acesso do GitHub precisa das permissões repo e workflow. Saia e autorize de novo pelo botão do app."
        : e.message;
      erro.hidden = false;
    } finally { botao.disabled = false; }
  };

  return el("div", { class: "folha" },
    el("h3", {}, "✨ Falta um passo neste projeto"),
    el("p", {}, "Autorize o Claude uma vez. Depois disso ele trabalha mesmo com o computador desligado."),
    guardada || estado.chave ? null : el("ol", {},
      el("li", {}, "No computador, abra o Terminal e rode:"),
      el("div", { class: "comando", style: "margin:6px 0 8px -20px" }, el("span", {}, "claude setup-token"), copiar),
      el("li", {}, "Faça login e copie o código que aparece (sk-ant-…)."),
      el("li", {}, "Mande para o celular, copie, e toque no botão abaixo.")
    ),
    botao, status, erro
  );
}

function markdownSimples(texto) {
  const frag = document.createDocumentFragment();
  const re = /\[([^\]]+)\]\((https?:\/\/[^)]+)\)|\*\*([^*]+)\*\*|`([^`]+)`/g;
  let ultimo = 0, m;
  while ((m = re.exec(texto))) {
    if (m.index > ultimo) frag.append(texto.slice(ultimo, m.index));
    if (m[1]) frag.append(el("a", { href: m[2], target: "_blank", rel: "noopener" }, m[1]));
    else if (m[3]) frag.append(el("b", {}, m[3]));
    else frag.append(el("code", {}, m[4]));
    ultimo = re.lastIndex;
  }
  frag.append(texto.slice(ultimo));
  return frag;
}
const semAnexos = (t) => String(t || "").replace(/\n*📎 Anexos:[\s\S]*$/, "").trim();
const temAnexo = (t) => /📎 Anexos:/.test(String(t || ""));
const ehRobo = (c) => c.user?.type === "Bot";
const ehInicio = (c) => ehRobo(c) && /^⏳/.test(c.body);

function telaChat(tela, repo, conversa) {

  const enviar = el("button", { class: "redondo enviar", "aria-label": "Enviar", disabled: true }, "↑");
  let arquivos = [], enviando = false;

  tela.append(cab, chat, el("div", { class: "compositor" }, anexosEl, el("div", { class: "caixa" }, clipe, texto, mic, enviar), seletor));

  const ajustar = () => {

    enviar.disabled = !texto.value.trim() && !arquivos.length;
  };
  texto.addEventListener("input", ajustar);
  texto.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches) { e.preventDefault(); mandar(); } });

  const pintarAnexos = () => {
    anexosEl.hidden = !arquivos.length;
    anexosEl.replaceChildren(...arquivos.map((f, i) => el("span", {}, `📄 ${f.name}`, el("button", { onclick: () => { arquivos.splice(i, 1); pintarAnexos(); ajustar(); } }, "✕"))));
  };
  seletor.onchange = () => {
    for (const f of seletor.files) { if (f.size > 20 * 1024 * 1024) toast(`${f.name} passa de 20 MB`); else arquivos.push(f); }
    seletor.value = ""; pintarAnexos(); ajustar();
  };

  const Reconhecer = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Reconhecer) mic.hidden = true;
  else {
    let rec = null;
    mic.onclick = () => {
      vibrar();
      if (rec) { rec.stop(); return; }
      rec = new Reconhecer(); rec.lang = "pt-BR"; rec.interimResults = true;
      const base = texto.value ? texto.value + " " : "";
      rec.onresult = (e) => { texto.value = base + [...e.results].map((r) => r[0].transcript).join(""); ajustar(); };
      rec.onend = () => { rec = null; mic.classList.remove("gravando"); };
      mic.classList.add("gravando"); rec.start();
    };
  }

  function vazio() {
    const ideias = ["Mudar a cor de um título", "Corrigir um erro na tela", "Criar um botão novo", "Trocar um texto"];
    chat.replaceChildren(el("div", { class: "vazio" },
      el("div", { class: "grande" }, "💡"),
      el("b", {}, "Diga com suas palavras"),
      el("p", {}, "Quanto mais exato, melhor. Ex.: “deixe o título PAINEL EXECUTIVO em amarelo”."),
      el("div", { class: "sugestoes" }, ideias.map((i) => el("button", { onclick: () => { texto.value = i + ": "; ajustar(); texto.focus(); } }, i)))
    ));
  }

  // Cancelar: para a execução no GitHub e deixa marcado na conversa.
  // A mensagem "🛑" é ignorada pelo robô, então não começa outro pedido.
  async function cancelarPedido(tituloDaConversa, botao) {
    if (!confirm("Cancelar este pedido? O Claude para agora e nada é enviado ao GitHub.")) return;
    vibrar(); botao.disabled = true; botao.textContent = "Cancelando…";
    try {
      const listas = await Promise.all(["in_progress", "queued", "waiting", "pending"].map((s) =>
        gh(`/repos/${repo.full_name}/actions/workflows/lovablex.yml/runs?status=${s}&per_page=30`).catch(() => ({ workflow_runs: [] }))));
      const rodando = listas.flatMap((l) => l.workflow_runs || []);
      const desta = rodando.filter((r) => r.display_title === tituloDaConversa);
      const alvos = desta.length ? desta : rodando;
      await Promise.all(alvos.map((r) => gh(`/repos/${repo.full_name}/actions/runs/${r.id}/cancel`, { metodo: "POST" }).catch(() => null)));
      await gh(`/repos/${repo.full_name}/issues/${numero}/comments`, { metodo: "POST", corpo: { body: "🛑 Pedido cancelado." } });
      toast(alvos.length ? "Pedido cancelado ✓" : "Não havia nada rodando — marcado como cancelado");
      assinatura = ""; clearTimeout(espera); ciclo();
    } catch (e) {
      toast(`Não consegui cancelar: ${e.message}`, 5000);
      botao.disabled = false; botao.textContent = "Cancelar pedido";
    }
  }

  function etapas(comentarios, desde, tituloDaConversa) {
    // pedido mais recente = a última mensagem da pessoa; acompanha só o que veio depois dela
    const depois = comentarios.filter((c) => new Date(c.created_at) >= new Date(desde));
    const comecou = depois.some(ehInicio);
    const terminou = depois.some((c) => ehRobo(c) && !ehInicio(c));
    if (terminou) return null;
    const item = (txt, estado) => el("div", { class: `etapa ${estado}` }, el("i", {}, estado === "feita" ? "✓" : ""), txt);
    const cancelar = el("button", { class: "btn claro pequeno", style: "margin-top:10px;color:var(--vermelho)" }, "Cancelar pedido");
    cancelar.onclick = () => cancelarPedido(tituloDaConversa, cancelar);
    return el("div", { class: "etapas" },
      item("Pedido recebido", "feita"),
      item("Claude trabalhando", comecou ? "agora" : ""),
      item("Enviado ao GitHub", ""),
      cancelar
    );
  }

  let assinatura = "";
  async function atualizar() {
    if (!numero) { if (!chat.childElementCount) vazio(); return true; }
    const [issue, comentarios] = await Promise.all([
      gh(`/repos/${repo.full_name}/issues/${numero}`),
      gh(`/repos/${repo.full_name}/issues/${numero}/comments?per_page=100`)
    ]);
    const nova = `${issue.updated_at}|${comentarios.length}|${comentarios.at(-1)?.updated_at || ""}`;
    const ehCancelamento = (c) => !ehRobo(c) && /^🛑/.test(c.body || "");
    const ultimaDaPessoa = [...comentarios].reverse().find((c) => !ehRobo(c));
    const cancelado = Boolean(ultimaDaPessoa && ehCancelamento(ultimaDaPessoa));
    const desde = ultimaDaPessoa ? ultimaDaPessoa.created_at : issue.created_at;
    const final = cancelado || !etapas(comentarios, desde, issue.title);
    if (nova === assinatura) return final;
    assinatura = nova;

    const nos = [];
    const bolhaEu = (corpo, quando_) => el("div", { class: "bolha eu" }, markdownSimples(semAnexos(corpo) || "(anexo)"),
      temAnexo(corpo) ? el("span", { class: "anexo-tag" }, "📎 com anexo") : null, el("span", { class: "hora" }, hora(quando_)));
    nos.push(bolhaEu([issue.title, issue.body].filter(Boolean).join("\n\n"), issue.created_at));
    for (const c of comentarios) {
      if (ehInicio(c)) continue;
      if (ehCancelamento(c)) {
        nos.push(el("div", { class: "bolha bot", style: "color:var(--vermelho)" }, "🛑 Pedido cancelado", el("span", { class: "hora" }, hora(c.created_at))));
        continue;
      }
      nos.push(ehRobo(c)
        ? el("div", { class: "bolha bot" }, markdownSimples(c.body), el("span", { class: "hora" }, hora(c.created_at)))
        : bolhaEu(c.body, c.created_at));
    }
    const andamento = cancelado ? null : etapas(comentarios, desde, issue.title);
    if (andamento) nos.push(andamento);
    chat.replaceChildren(...nos);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    return !andamento;
  }

  let vivo = true, espera = null;
  const ciclo = async () => {
    if (!vivo) return;
    let final = true;
    try { final = await atualizar(); } catch (e) { if (e.status === 401) return ir(telaInicio, { raiz: true }); }
    if (vivo) espera = setTimeout(ciclo, final ? 20000 : 4000);
  };
  pararTela = () => { vivo = false; clearTimeout(espera); };
  ciclo();

  async function subirAnexos() {
    const caminhos = [];
    for (const f of arquivos) {
      const caminho = `.lovablex/anexos/${Date.now()}-${f.name.replace(/[^\w.\-() ]+/g, "_")}`;
      await gh(`/repos/${repo.full_name}/contents/${encodeURI(caminho)}`, {
        metodo: "PUT", corpo: { message: `LovableX Celular: anexo ${f.name}`, content: b64(new Uint8Array(await f.arrayBuffer())) }
      });
      caminhos.push(caminho);
    }
    return caminhos;
  }

  async function mandar() {
    const pedido = texto.value.trim();
    if (enviando || (!pedido && !arquivos.length)) return;
    enviando = true; enviar.disabled = true; vibrar();
    try {
      let corpo = pedido || "Veja o anexo.";
      if (arquivos.length) {
        toast("Enviando anexo…", 10000);
        const caminhos = await subirAnexos();
        corpo += `\n\n📎 Anexos:\n${caminhos.map((c) => `- \`${c}\``).join("\n")}`;
      }
      if (numero) {
        await gh(`/repos/${repo.full_name}/issues/${numero}/comments`, { metodo: "POST", corpo: { body: corpo } });
      } else {
        const titulo = (pedido || "Pedido com anexo").split("\n")[0].slice(0, 80);
        const resto = corpo.slice(titulo.length).trim();
        const issue = await gh(`/repos/${repo.full_name}/issues`, { metodo: "POST", corpo: { title: titulo, body: resto, labels: [ETIQUETA] } });
        numero = issue.number;
        cab.querySelector(".nome b").textContent = issue.title;
      }
      texto.value = ""; arquivos = []; pintarAnexos(); ajustar();
      toast("Enviado ✓ O Claude já vai começar");
      assinatura = ""; clearTimeout(espera); ciclo();
    } catch (e) {
      toast(e.status === 410 ? "As issues estão desligadas neste projeto no GitHub." : `Não enviou: ${e.message}`, 6000);
      ajustar();
    } finally { enviando = false; }
  }
  enviar.onclick = mandar;
}

/* =================== início =================== */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
ir(tokenGH ? telaProjetos : telaInicio, { raiz: true });
</script>

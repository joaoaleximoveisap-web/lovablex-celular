# LovableX Celular — pedidos pelo celular, sem precisar do computador.
#
# O app do celular abre uma "issue" com a etiqueta `lovablex` (ou comenta
# numa que já existe). Este workflow roda o Claude Code na nuvem do GitHub,
# faz a alteração, envia para a branch principal (o Lovable puxa sozinho) e
# responde na própria conversa — que é o que aparece no chat do celular.
#
# Precisa de UM destes secrets no repositório (o app cadastra para você):
#   CLAUDE_CODE_OAUTH_TOKEN  → usa o seu plano do Claude (gerado com `claude setup-token`)
#   ANTHROPIC_API_KEY        → usa créditos da API da Anthropic
name: LovableX Celular

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  id-token: write

# um pedido por vez em cada projeto: dois ao mesmo tempo brigariam pelo mesmo arquivo
concurrency:
  group: lovablex-${{ github.repository }}
  cancel-in-progress: false

jobs:
  pedido:
    # só conversas do app; ignora as respostas do próprio robô (evita laço)
    if: >-
      contains(github.event.issue.labels.*.name, 'lovablex') &&
      github.event.issue.pull_request == null &&
      (github.event_name == 'issues' || github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      NUM: ${{ github.event.issue.number }}
      TITULO: ${{ github.event.issue.title }}
      CORPO: ${{ github.event.issue.body }}
      COMENTARIO: ${{ github.event.comment.body }}
      EVENTO: ${{ github.event_name }}
      RAMO: ${{ github.event.repository.default_branch }}
      TEM_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Avisar que começou
        run: gh issue comment "$NUM" --body "⏳ Recebi. Trabalhando no pedido…"

      - name: Montar o pedido com o histórico da conversa
        id: montar
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUM/comments" --paginate > "$RUNNER_TEMP/comentarios.json" || echo "[]" > "$RUNNER_TEMP/comentarios.json"
          node - <<'JS'
          const fs = require("fs");
          const env = process.env;
          let comentarios = [];
          try { comentarios = JSON.parse(fs.readFileSync(`${env.RUNNER_TEMP}/comentarios.json`, "utf8")); } catch {}
          const limpar = (t) => String(t || "").replace(/^⏳ Recebi\. Trabalhando no pedido…$/m, "").trim();
          const historico = comentarios
            .filter((c) => limpar(c.body))
            .slice(-12)
            .map((c) => `${c.user && c.user.type === "Bot" ? "LOVABLEX" : "PESSOA"}: ${limpar(c.body).slice(0, 1500)}`)
            .join("\n\n");
          const atual = env.EVENTO === "issue_comment" ? env.COMENTARIO : `${env.TITULO}\n\n${env.CORPO || ""}`;
          const pedido = [
            "Você é o LovableX: recebe pedidos do celular para um projeto do Lovable sincronizado com este repositório do GitHub.",
            "Tudo que você mudar aqui vai para a branch principal e o Lovable puxa sozinho em seguida.",
            "",
            "REGRAS:",
            "- Faça a menor alteração completa que resolve o pedido. Não reescreva o que não foi pedido.",
            "- Não mexa em .github/ nem em arquivos de configuração do Lovable.",
            "- Não faça commit nem push: o workflow cuida disso depois que você terminar.",
            "- Anexos enviados pelo celular ficam em .lovablex/anexos/. Leia-os quando forem relevantes.",
            "  Se um anexo precisar ficar no app (ex.: imagem), COPIE para a pasta public/ e use esse caminho.",
            "- Pedido sobre dados do banco (cadastros, acessos) não se resolve só com código: explique isso na resposta.",
            "- AO TERMINAR, escreva em .lovablex/resposta.md um resumo curto em português (2 a 5 linhas),",
            "  para leigo: o que mudou e onde ver na tela. Esse arquivo é a sua resposta no celular.",
            "",
            historico ? `CONVERSA ATÉ AQUI:\n${historico}\n` : "",
            `PEDIDO ATUAL:\n${String(atual || "").trim()}`
          ].join("\n");
          const marca = `FIM_${Date.now()}_${Math.random().toString(36).slice(2)}`;
          fs.appendFileSync(env.GITHUB_OUTPUT, `pedido<<${marca}\n${pedido}\n${marca}\n`);
          JS

      - name: Claude (plano do Claude)
        id: claude_oauth
        if: env.TEM_OAUTH == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.montar.outputs.pedido }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm *),Bash(npx *),Bash(node *),Bash(ls *),Bash(git status *),Bash(git diff *),Bash(git log *)"

      - name: Claude (chave da API)
        id: claude_api
        if: env.TEM_OAUTH != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.montar.outputs.pedido }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm *),Bash(npx *),Bash(node *),Bash(ls *),Bash(git status *),Bash(git diff *),Bash(git log *)"

      - name: Enviar ao GitHub
        id: enviar
        run: |
          if [ -f .lovablex/resposta.md ]; then cp .lovablex/resposta.md "$RUNNER_TEMP/resposta.md"; fi
          rm -f .lovablex/resposta.md
          # anexos já cumpriram o papel; o que precisava ficar foi copiado para public/
          git rm -r -q --ignore-unmatch .lovablex/anexos >/dev/null 2>&1 || true
          rm -rf .lovablex/anexos
          git config user.name "LovableX Celular"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "LovableX: $(printf '%s' "$TITULO" | head -c 70)"
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$RAMO")" ]; then
            git push -q origin "HEAD:$RAMO" || { git pull -q --rebase origin "$RAMO" && git push -q origin "HEAD:$RAMO"; }
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Responder no celular
        if: always()
        env:
          SHA: ${{ steps.enviar.outputs.sha }}
          CLAUDE_OK: ${{ steps.claude_oauth.outcome == 'success' || steps.claude_api.outcome == 'success' }}
        run: |
          {
            if [ -f "$RUNNER_TEMP/resposta.md" ]; then cat "$RUNNER_TEMP/resposta.md"; echo; fi
            if [ -n "$SHA" ]; then
              echo "✅ **Enviado ao GitHub** · [\`${SHA:0:7}\`](https://github.com/$GITHUB_REPOSITORY/commit/$SHA) — o Lovable puxa em instantes."
            elif [ "$CLAUDE_OK" != "true" ]; then
              echo "❌ Não consegui concluir. [Ver detalhes](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            else
              echo "ℹ️ Nada precisou mudar no código."
            fi
          } > "$RUNNER_TEMP/final.md"
          gh issue comment "$NUM" --body-file "$RUNNER_TEMP/final.md"

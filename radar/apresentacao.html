<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEMANDA X · Apresentação</title>
<meta name="description" content="Short stay em Londrina: ocupação, diária e quanto um studio pode render — com dados reais do Airbnb.">
<meta name="theme-color" content="#05070c">
<meta property="og:title" content="Short stay em Londrina — DEMANDA X">
<meta property="og:description" content="Ocupação, diária e quanto um studio pode render, com dados reais do Airbnb.">
<meta property="og:image" content="https://joaoaleximoveisap-web.github.io/lovablex-celular/radar/marca/compartilhar.png">
<link rel="icon" href="marca/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="marca/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --fundo: #05070c; --texto: #f4f2ee; --texto2: #c3c2b7; --apagado: #8a8d99; --linha: rgba(255,255,255,.1);
    --azul: #3987e5; --violeta: #9085e9; --laranja: #d95926; --laranja2: #f08a5d; --verde: #34d399;
    --acento: linear-gradient(120deg, #3987e5 0%, #9085e9 45%, #d95926 100%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto); font: 16px/1.4 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  h1, h2, .num { font-family: "Space Grotesk", Inter, sans-serif; letter-spacing: -.03em; margin: 0; }
  .palco { position: fixed; inset: 0; }
  .fundo { position: absolute; inset: -20%; pointer-events: none; transition: background 1s ease;
    background: radial-gradient(40% 40% at 20% 20%, rgba(57,135,229,.35), transparent 70%), radial-gradient(40% 40% at 85% 80%, rgba(217,89,38,.3), transparent 70%); filter: blur(10px); animation: flutua 18s ease-in-out infinite alternate; }
  @keyframes flutua { to { transform: translate(4%, -3%) scale(1.08); } }
  .barras-topo { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 14px; right: 14px; display: flex; gap: 5px; z-index: 20; }
  .barras-topo span { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.18); overflow: hidden; }
  .barras-topo span i { display: block; height: 100%; width: 0; background: #fff; }
  .barras-topo span.feito i { width: 100%; }
  .barras-topo span.atual i { animation: enche var(--dur, 7s) linear forwards; }
  .barras-topo.pausado span.atual i { animation-play-state: paused; }
  @keyframes enche { to { width: 100%; } }
  .marca { position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 14px); left: 16px; z-index: 20; display: flex; align-items: center; gap: 8px; font: 700 14px "Space Grotesk"; }
  .marca img { width: 26px; height: 26px; }
  .marca b { background: var(--acento); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .acoes { position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 10px); right: 12px; z-index: 20; display: flex; gap: 6px; }
  .acoes button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--linha); background: rgba(255,255,255,.06); color: var(--texto); font-size: 15px; cursor: pointer; display: grid; place-items: center; }
  .slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 90px max(22px, 6vw) 70px; opacity: 0; visibility: hidden; transform: translateX(30px) scale(.98); transition: opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1), visibility .55s; }
  .slide.ativo { opacity: 1; visibility: visible; transform: none; }
  .slide.saiu { transform: translateX(-30px) scale(.98); }
  .conteudo { width: 100%; max-width: 1100px; margin: 0 auto; }
  .chapeu { font-size: clamp(12px, 1.6vw, 15px); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--texto2); margin-bottom: 14px; }
  .titulo { font-size: clamp(34px, 7vw, 88px); line-height: .98; font-weight: 700; }
  .titulo .g { background: var(--acento); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { font-size: clamp(16px, 2.2vw, 24px); color: var(--texto2); margin-top: 18px; max-width: 720px; }
  .gigante { font: 700 clamp(84px, 20vw, 240px)/.9 "Space Grotesk"; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
  .gigante small { font-size: .32em; letter-spacing: -.02em; color: var(--texto2); margin-left: .12em; }
  .g-azul { color: #86b6ef; } .g-laranja { color: var(--laranja2); } .g-verde { color: var(--verde); }
  .revela > * { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
  .slide.ativo .revela > * { opacity: 1; transform: none; }
  .slide.ativo .revela > *:nth-child(2) { transition-delay: .15s; } .slide.ativo .revela > *:nth-child(3) { transition-delay: .3s; }
  .slide.ativo .revela > *:nth-child(4) { transition-delay: .45s; } .slide.ativo .revela > *:nth-child(5) { transition-delay: .6s; }
  /* comparação em barras */
  .duelo { display: grid; gap: 22px; margin-top: 34px; max-width: 900px; }
  .duelo .l { display: grid; grid-template-columns: minmax(110px, 200px) 1fr auto; align-items: center; gap: 16px; font-size: clamp(15px, 2vw, 22px); font-weight: 600; }
  .duelo .trilho { height: clamp(18px, 3vw, 30px); border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
  .duelo .trilho i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width 1.4s cubic-bezier(.2,.8,.2,1) .3s; }
  .duelo .v { font: 700 clamp(22px, 3.6vw, 44px) "Space Grotesk"; font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
  /* colunas por ano */
  .anos { display: flex; align-items: flex-end; gap: clamp(6px, 1.2vw, 14px); height: clamp(150px, 30vh, 300px); margin-top: 30px; max-width: 900px; }
  .anos .c { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .anos .c i { width: 100%; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, #34d399, #199e70); height: 0; transition: height 1.2s cubic-bezier(.2,.8,.2,1); }
  .anos .c span { font-size: clamp(10px, 1.3vw, 13px); color: var(--apagado); }
  .anos .c b { font: 700 clamp(11px, 1.4vw, 15px) "Space Grotesk"; opacity: 0; transition: opacity .4s 1s; }
  .slide.ativo .anos .c b { opacity: 1; }
  /* ranking de unidades */
  .ranking { display: grid; gap: 12px; margin-top: 30px; max-width: 860px; }
  .ranking .r { display: grid; grid-template-columns: 90px 1fr 64px; gap: 14px; align-items: center; font: 700 clamp(15px, 2vw, 20px) "Space Grotesk"; }
  .ranking .trilho { height: 16px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
  .ranking .trilho i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #199e70, #34d399); transition: width 1.3s cubic-bezier(.2,.8,.2,1); }
  .ranking .r small { display: block; font: 500 12px Inter; color: var(--apagado); }
  /* grade do prédio */
  .predio { display: grid; grid-template-columns: repeat(9, 1fr); gap: clamp(5px, 1vw, 10px); max-width: 560px; margin-top: 30px; }
  .predio i { aspect-ratio: 1; border-radius: 8px; background: rgba(255,255,255,.08); transition: background .3s, transform .3s; }
  .predio i.on { background: linear-gradient(135deg, #fb7185, #d95926); transform: scale(1); box-shadow: 0 0 18px rgba(251,113,133,.35); }
  /* simulador */
  .sim { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 3vw, 40px); margin-top: 24px; align-items: start; }
  .sim .campos { display: grid; gap: 14px; }
  .sim label { display: grid; gap: 6px; font-size: 13px; color: var(--texto2); font-weight: 600; }
  .sim label .lin { display: flex; justify-content: space-between; align-items: baseline; }
  .sim label output { font: 700 18px "Space Grotesk"; color: var(--texto); }
  .sim input[type=range] { width: 100%; accent-color: #9085e9; height: 28px; }
  .cenarios { display: grid; gap: 10px; }
  .cen { border-radius: 20px; padding: 16px 18px; border: 1px solid var(--linha); background: rgba(255,255,255,.04); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
  .cen.destaque { border-color: rgba(144,133,233,.6); background: linear-gradient(135deg, rgba(57,135,229,.18), rgba(217,89,38,.14)); }
  .cen .nm { font-size: 13px; font-weight: 700; color: var(--texto2); text-transform: uppercase; letter-spacing: .08em; }
  .cen .oc { font-size: 12.5px; color: var(--apagado); text-align: right; }
  .cen .mes { font: 700 clamp(26px, 3.6vw, 40px) "Space Grotesk"; font-variant-numeric: tabular-nums; }
  .cen .mes small { font: 600 13px Inter; color: var(--apagado); }
  .cen .aa { font: 700 clamp(18px, 2.4vw, 26px) "Space Grotesk"; color: var(--verde); text-align: right; }
  .cen .aa small { display: block; font: 600 11px Inter; color: var(--apagado); }
  .nota { font-size: 11.5px; color: var(--apagado); margin-top: 12px; max-width: 900px; }
  .cta { display: inline-flex; align-items: center; gap: 10px; margin-top: 30px; font: 700 clamp(17px, 2.2vw, 22px) Inter; color: #fff; background: linear-gradient(120deg, #25d366, #128c7e); border: 0; border-radius: 999px; padding: 16px 26px; text-decoration: none; box-shadow: 0 16px 40px rgba(37,211,102,.25); }
  .cta.sec { background: rgba(255,255,255,.08); box-shadow: none; border: 1px solid var(--linha); }
  .fonte { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 11px; color: var(--apagado); z-index: 20; padding: 0 16px; }
  .toque { position: absolute; top: 70px; bottom: 50px; width: 30%; z-index: 10; cursor: pointer; }
  .toque.esq { left: 0; } .toque.dir { right: 0; }
  .slide .interativo { position: relative; z-index: 15; }
  @media (max-width: 760px) {
    .sim { grid-template-columns: 1fr; }
    .slide { padding-top: 84px; padding-bottom: 120px; justify-content: flex-start; overflow-y: auto; }
    .fonte { background: linear-gradient(0deg, var(--fundo) 60%, transparent); padding-top: 18px; bottom: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .sim label .lin small { display: none; }
    .duelo .l { grid-template-columns: 1fr auto; row-gap: 8px; }
    .duelo .trilho { grid-column: 1 / -1; grid-row: 2; }
    .palco::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: calc(max(12px, env(safe-area-inset-top)) + 64px); background: linear-gradient(180deg, var(--fundo) 70%, transparent); z-index: 18; pointer-events: none; }
    .slide.centro { justify-content: center; }
    .predio { grid-template-columns: repeat(9, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) { .fundo { animation: none; } .slide, .revela > * { transition: none; } }
</style>
</head>
<body>
<div class="palco" id="palco">
  <div class="fundo" id="fundo"></div>
  <div class="barras-topo" id="barras"></div>
  <div class="marca"><img src="marca/icone.svg" alt=""><span>DEMANDA <b>X</b></span></div>
  <div class="acoes">
    <button id="btPausa" title="Pausar / continuar" aria-label="Pausar">❚❚</button>
    <button id="btTela" title="Tela cheia" aria-label="Tela cheia">⛶</button>
    <button id="btSair" title="Voltar ao app" aria-label="Voltar ao app">✕</button>
  </div>
  <div class="toque esq" id="tqEsq" aria-hidden="true"></div>
  <div class="toque dir" id="tqDir" aria-hidden="true"></div>
  <div id="slides"></div>
  <div class="fonte" id="fonte"></div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const nf = (v, d = 0) => v == null || isNaN(v) ? "—" : v.toLocaleString("pt-BR", { maximumFractionDigits: d, minimumFractionDigits: d });
const brl = v => v == null || isNaN(v) ? "—" : "R$ " + nf(Math.round(v));
const media = a => { const v = a.filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const mediana = a => { const v = a.filter(x => x != null && !isNaN(x)).sort((x, y) => x - y); if (!v.length) return null; const m = v.length >> 1; return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
const dt = s => new Date(s + "T12:00");
const SEMANA = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const q = new URLSearchParams(location.search);
// personalização pelo link: ?whats=5543999999999&nome=Fulano&preco=380000
const WHATS = (q.get("whats") || "").replace(/\D/g, "");
const NOME = q.get("nome") || "";

let D, slides = [], atual = 0, pausado = false, timer = null;

function ocupHistorico(u) {
  if (u[9] == null || !u[7]) return null;
  const agora = new Date().getFullYear() + new Date().getMonth() / 12, anos = Math.max(.25, agora - u[9]);
  if (anos < .75) return null;
  const porAno = u[7] / anos;
  return { padrao: Math.min(100, porAno / .5 * 3 / 365 * 100), conservador: Math.min(100, porAno / .72 * 2.5 / 365 * 100) };
}
const codigoUn = u => { const m = (u[1] || "").match(/JH\s*-?\s*(\d{3,4})/i) || (u[1] || "").match(/\b(\d{3,4})\b/); return m ? "JH " + m[1] : "JH"; };

// ---------- números da apresentação (todos vindos da coleta) ----------
function calcular() {
  const total = D.unidades.length;
  const agora = new Date().getFullYear() + new Date().getMonth() / 12;
  const novas = D.unidades.filter(u => u[9] != null && u[9] >= agora - 1).length;
  const anos = {}; D.unidades.forEach(u => { if (u[9] != null) { const a = Math.floor(u[9]); anos[a] = (anos[a] || 0) + 1; } });
  const desde2024 = D.unidades.filter(u => u[9] != null && u[9] >= 2024).length;
  const P = (D.predios || [])[0];
  const N = P.ids.length, ids = new Set(P.ids), hojeMs = new Date(D.meta.coleta).getTime();
  const noites = a => Math.round((dt(a.checkout) - dt(a.checkin)) / 864e5);
  const porData = {}; D.amostras.filter(a => noites(a) === 2).forEach(a => porData[a.checkin + ":" + a.checkout] = a);
  const datas = P.datas.map(d => { const a = porData[d.checkin + ":" + d.checkout]; return { ...d, ocup: (1 - d.livres.length / N) * 100, diaria: media(Object.values(d.precos || {}).filter(Boolean)), londrina: a && a.livres != null ? Math.max(0, Math.min(100, (1 - a.livres * (D.meta.fator_londrina || 1) / total) * 100)) : null, diariaL: a?.mediana, rotulo: a?.rotulo, tipo: a?.tipo, dias: (dt(d.checkin) - hojeMs) / 864e5 }; });
  const prox = datas.filter(d => d.dias <= 30), perto = datas.filter(d => d.dias <= 240);
  const un = D.unidades.filter(u => ids.has(u[0]));
  const hist = un.map(u => ({ u, h: ocupHistorico(u) })).filter(x => x.h);
  const top = hist.slice().sort((a, b) => b.h.padrao - a.h.padrao);
  const acima80 = hist.filter(x => x.h.padrao >= 80);
  const lotado = datas.slice().sort((a, b) => b.ocup - a.ocup)[0];
  return {
    total, novas, anos, desde2024, N, nome: P.nome,
    oJH: media(prox.map(d => d.ocup)), oL: media(prox.map(d => d.londrina)),
    dJH: media(perto.map(d => d.diaria)), dL: media(perto.map(d => d.diariaL)),
    histCons: mediana(hist.map(x => x.h.conservador)), histPad: mediana(hist.map(x => x.h.padrao)),
    top: top.slice(0, 5), acima80: acima80.length, nHist: hist.length,
    topMed: mediana(acima80.map(x => x.h.padrao)),
    lotado,
  };
}

// ---------- slides ----------
function montar(K) {
  const L = K.lotado, dL = L ? dt(L.checkin) : null;
  const anosLista = Object.keys(K.anos).map(Number).sort((a, b) => a - b).filter(a => a >= 2017);
  const maxAno = Math.max(...anosLista.map(a => K.anos[a] || 0));
  slides = [
    { cor: ["57,135,229", "217,89,38"], dur: 6, html: `
      <div class="conteudo revela">
        <div class="chapeu">${NOME ? `Para ${esc(NOME)} · ` : ""}Londrina · Short stay</div>
        <h1 class="titulo">O jeito mais inteligente de<br><span class="g">fazer o imóvel trabalhar.</span></h1>
        <p class="sub">Dados reais do Airbnb, coletados em ${dt(D.meta.coleta.slice(0, 10)).toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" })}.</p>
      </div>` },
    { cor: ["52,211,153", "57,135,229"], dur: 8, html: `
      <div class="conteudo revela">
        <div class="chapeu">Um mercado em expansão</div>
        <div class="gigante g-verde"><span class="num" data-conta="${K.total}">0</span><small>hospedagens</small></div>
        <p class="sub"><b style="color:var(--texto)">${nf(K.desde2024 / K.total * 100)}%</b> delas entraram no Airbnb de 2024 para cá. Quem chegou antes está colhendo.</p>
        <div class="anos">${anosLista.map(a => `<div class="c"><b>${K.anos[a] || 0}</b><i data-altura="${(K.anos[a] || 0) / maxAno * 100}"></i><span>${a}</span></div>`).join("")}</div>
      </div>` },
    { cor: ["217,89,38", "57,135,229"], dur: 8, html: `
      <div class="conteudo revela">
        <div class="chapeu">${esc(K.nome)} · próximos 30 dias</div>
        <h2 class="titulo">Ocupa <span class="g">${nf(K.oJH / K.oL * 100 - 100)}% mais</span><br>que a média da cidade.</h2>
        <div class="duelo">
          <div class="l"><span>${esc(K.nome)}</span><span class="trilho"><i data-largura="${K.oJH}" style="background:linear-gradient(90deg,#d95926,#f08a5d)"></i></span><span class="v"><span data-conta="${K.oJH}" data-suf="%">0</span></span></div>
          <div class="l"><span>Londrina</span><span class="trilho"><i data-largura="${K.oL}" style="background:#3987e5"></i></span><span class="v" style="color:var(--texto2)"><span data-conta="${K.oL}" data-suf="%">0</span></span></div>
        </div>
      </div>` },
    { cor: ["217,89,38", "144,133,233"], dur: 7, html: `
      <div class="conteudo revela">
        <div class="chapeu">Diária média · ${esc(K.nome)}</div>
        <div class="gigante g-laranja"><span>R$ </span><span data-conta="${K.dJH}">0</span></div>
        <p class="sub"><b style="color:var(--verde);font-size:1.3em">+${nf((K.dJH / K.dL - 1) * 100)}%</b> acima da média de Londrina (${brl(K.dL)}). Localização e padrão se pagam na diária.</p>
      </div>` },
    { cor: ["52,211,153", "217,89,38"], dur: 9, html: `
      <div class="conteudo revela">
        <div class="chapeu">Os melhores apartamentos do prédio</div>
        <h2 class="titulo"><span class="g">${K.acima80} de ${K.nHist}</span> passam de<br>80% de ocupação.</h2>
        <div class="ranking">${K.top.map(x => `<div class="r"><span>${esc(codigoUn(x.u))}<small>★ ${nf(x.u[6], 2)} · ${x.u[7]} aval.</small></span><span class="trilho"><i data-largura="${x.h.padrao}"></i></span><span>${x.h.padrao >= 95 ? "95%+" : nf(x.h.padrao) + "%"}</span></div>`).join("")}</div>
        <p class="nota">Ocupação estimada pelo ritmo de avaliações desde a entrada no Airbnb (modelo de mercado: metade dos hóspedes avalia, 3 noites por estadia).</p>
      </div>` },
    ...(L && L.ocup >= 80 ? [{ cor: ["251,113,133", "217,89,38"], dur: 7, html: `
      <div class="conteudo revela">
        <div class="chapeu">${SEMANA[dL.getDay()]}, ${dL.getDate()} de ${MESES[dL.getMonth()]}${L.tipo === "feriado" ? " · " + esc(L.rotulo) : ""}</div>
        <h2 class="titulo">Esgotado.<br><span class="g">${K.N - L.livres.length} de ${K.N}</span> ocupados.</h2>
        <div class="predio">${Array.from({ length: K.N }, (_, i) => `<i data-on="${i < K.N - L.livres.length ? 1 : 0}"></i>`).join("")}</div>
        <p class="sub">Quando a cidade lota, quem tem studio bem localizado não sobra vaga.</p>
      </div>` }] : []),
    { cor: ["144,133,233", "52,211,153"], dur: 0, sim: true, html: `
      <div class="conteudo revela">
        <div class="chapeu">Simule o seu studio</div>
        <h2 class="titulo" style="font-size:clamp(28px,5vw,60px)">Quanto ele pode <span class="g">render por mês?</span></h2>
        <div class="sim interativo">
          <div class="campos">
            <label><span class="lin">Valor do imóvel <output id="oPreco"></output></span><input type="range" id="sPreco" min="150000" max="1500000" step="10000"></label>
            <label><span class="lin">Diária para o anfitrião <output id="oDiaria"></output></span><input type="range" id="sDiaria" min="120" max="900" step="5"></label>
            <label><span class="lin">Custos fixos/mês <small style="font-weight:500;color:var(--apagado)">(condomínio, IPTU, energia, internet)</small><output id="oFixo"></output></span><input type="range" id="sFixo" min="0" max="3000" step="50"></label>
            <label><span class="lin">Administração + taxa Airbnb <output id="oGestao"></output></span><input type="range" id="sGestao" min="0" max="40" step="1"></label>
          </div>
          <div class="cenarios" id="cenarios"></div>
        </div>
        <p class="nota">Simulação com dados de mercado coletados no Airbnb — não é promessa de rendimento. Diária inicial = média anunciada no prédio menos a taxa de serviço que o hóspede paga ao Airbnb (~14%). Receita = diária × noites ocupadas no mês (30), menos administração, taxa do anfitrião e custos fixos; antes de impostos. Ocupações: conservador = mediana conservadora do prédio; realista = mediana do prédio no modelo de mercado; top = mediana das unidades acima de 80%.</p>
      </div>` },
    { cor: ["37,211,102", "57,135,229"], dur: 0, html: `
      <div class="conteudo revela">
        <div class="chapeu">Próximo passo</div>
        <h2 class="titulo">Os bons studios<br><span class="g">são os primeiros a sair.</span></h2>
        <p class="sub">Fale com a gente e veja as unidades disponíveis.</p>
        <div class="interativo">${WHATS ? `<a class="cta" target="_blank" rel="noopener" href="https://wa.me/${WHATS}?text=${encodeURIComponent("Olá! Vi a apresentação DEMANDA X e quero saber dos studios para short stay em Londrina.")}">💬 Quero meu studio</a>` : `<a class="cta sec" href="./#predio">Ver todos os dados →</a>`}</div>
      </div>` },
  ];
  $("#slides").innerHTML = slides.map((s, i) => `<section class="slide ${s.sim || i === 0 || i === slides.length - 1 ? "" : "centro"}" data-i="${i}">${s.html}</section>`).join("");
  $("#barras").innerHTML = slides.map(() => `<span><i></i></span>`).join("");
  $("#fonte").textContent = `Fonte: páginas públicas do Airbnb · ${K.total} hospedagens e ${K.N} unidades do ${K.nome} acompanhadas · ocupação e receita são estimativas`;
  montarSimulador(K);
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ---------- simulador ----------
function montarSimulador(K) {
  const s = id => document.getElementById(id);
  s("sPreco").value = +q.get("preco") || 380000;
  // o preço exibido no Airbnb inclui a taxa de serviço paga pelo hóspede (~14%); o anfitrião recebe o resto
  s("sDiaria").value = Math.round(K.dJH / 1.14 / 5) * 5;
  s("sFixo").value = 900;
  s("sGestao").value = 23;   // ~20% administradora + ~3% taxa do anfitrião no Airbnb
  const cen = [
    ["Conservador", K.histCons],
    ["Realista", K.histPad, true],
    ["Top do prédio", K.topMed],
  ].filter(c => c[1] != null);
  const calc = () => {
    const preco = +s("sPreco").value, diaria = +s("sDiaria").value, fixo = +s("sFixo").value, gestao = +s("sGestao").value / 100;
    s("oPreco").textContent = brl(preco); s("oDiaria").textContent = brl(diaria); s("oFixo").textContent = brl(fixo); s("oGestao").textContent = nf(gestao * 100) + "%";
    s("cenarios").innerHTML = cen.map(([nm, oc, dest]) => {
      const bruto = diaria * 30 * oc / 100, liq = bruto * (1 - gestao) - fixo, aa = liq * 12 / preco * 100;
      return `<div class="cen ${dest ? "destaque" : ""}"><span class="nm">${nm}</span><span class="oc">${nf(oc)}% ocupado</span><span class="mes">${brl(liq)}<small> /mês líquido</small></span><span class="aa">${nf(aa, 1)}%<small>ao ano</small></span></div>`;
    }).join("");
  };
  ["sPreco", "sDiaria", "sFixo", "sGestao"].forEach(id => s(id).addEventListener("input", calc));
  calc();
}

// ---------- animações ----------
function contar(el) {
  const fim = +el.dataset.conta, suf = el.dataset.suf || "", t0 = performance.now(), dur = 1400;
  const passo = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = nf(fim * e) + suf; if (p < 1) requestAnimationFrame(passo); };
  requestAnimationFrame(passo);
}
function animar(sl) {
  sl.querySelectorAll("[data-conta]").forEach(contar);
  sl.querySelectorAll("[data-largura]").forEach(el => { el.style.width = "0"; requestAnimationFrame(() => setTimeout(() => el.style.width = Math.min(100, +el.dataset.largura) + "%", 60)); });
  sl.querySelectorAll("[data-altura]").forEach((el, i) => { el.style.height = "0"; setTimeout(() => el.style.height = Math.max(2, +el.dataset.altura) + "%", 200 + i * 70); });
  sl.querySelectorAll(".predio i").forEach((el, i) => { el.classList.remove("on"); if (el.dataset.on === "1") setTimeout(() => el.classList.add("on"), 300 + i * 45); });
}

// ---------- navegação (toque, setas, deslizar) ----------
function ir(i) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  const els = document.querySelectorAll(".slide");
  els.forEach((el, k) => { el.classList.toggle("ativo", k === i); el.classList.toggle("saiu", k < i); });
  document.querySelectorAll("#barras span").forEach((b, k) => { b.className = k < i ? "feito" : k === i ? "atual" : ""; });
  const s = slides[i];
  $("#fundo").style.background = `radial-gradient(40% 40% at 20% 20%, rgba(${s.cor[0]},.38), transparent 70%), radial-gradient(40% 40% at 85% 80%, rgba(${s.cor[1]},.32), transparent 70%)`;
  atual = i;
  animar(els[i]);
  clearTimeout(timer);
  const barra = document.querySelectorAll("#barras span")[i];
  barra.style.setProperty("--dur", (s.dur || 9999) + "s");
  barra.querySelector("i").style.animation = "none"; void barra.offsetWidth; barra.querySelector("i").style.animation = "";
  if (s.dur && !pausado) timer = setTimeout(() => ir(atual + 1), s.dur * 1000);
  if (!s.dur) barra.classList.add("feito");
  history.replaceState(null, "", location.pathname + location.search + "#" + (i + 1));
}
$("#tqDir").onclick = () => ir(atual + 1);
$("#tqEsq").onclick = () => ir(atual - 1);
document.addEventListener("keydown", e => {
  if (e.target.matches("input")) return;
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); ir(atual + 1); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); ir(atual - 1); }
  if (e.key === "f") tela();
});
let x0 = null;
document.addEventListener("touchstart", e => { if (!e.target.closest(".interativo")) x0 = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) ir(atual + (dx < 0 ? 1 : -1)); x0 = null; });
$("#btPausa").onclick = () => { pausado = !pausado; $("#btPausa").textContent = pausado ? "▶" : "❚❚"; $("#barras").classList.toggle("pausado", pausado); if (pausado) clearTimeout(timer); else ir(atual); };
function tela() { document.fullscreenElement ? document.exitFullscreen?.() : document.documentElement.requestFullscreen?.().catch(() => {}); }
$("#btTela").onclick = tela;
$("#btSair").onclick = () => { location.href = "./#predio"; };

(async () => {
  try { D = await (await fetch("data/londrina.json", { cache: "no-cache" })).json(); }
  catch { $("#slides").innerHTML = `<section class="slide ativo"><div class="conteudo"><h2 class="titulo">Sem conexão.</h2></div></section>`; return; }
  montar(calcular());
  ir(Math.max(0, (+location.hash.slice(1) || 1) - 1));
})();
</script>
</body>

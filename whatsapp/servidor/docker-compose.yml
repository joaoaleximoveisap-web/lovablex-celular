# Servidor do Evolution API: é ele que fica conectado no seu WhatsApp (via QR code)
# e repassa as mensagens para o robô na Cloudflare.
#
# Numa VPS com Docker:   cp .env.exemplo .env   (preencha)   e depois   docker compose up -d
# O painel fica em https://SEU_ENDERECO/manager
services:
  evolution:
    image: evoapicloud/evolution-api:latest
    restart: always
    env_file: .env
    environment:
      SERVER_URL: https://${ENDERECO}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${SENHA_BANCO}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: Robo do Joao
    volumes:
      - instancias:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${SENHA_BANCO}
      POSTGRES_DB: evolution
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - cache:/data

  # HTTPS automático (a Cloudflare só conversa com endereço https com nome)
  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${ENDERECO} --to evolution:8080
    volumes:
      - caddy:/data

volumes:
  instancias:
  banco:
  cache:
  caddy:

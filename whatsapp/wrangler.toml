# Configuração do robô no Cloudflare Workers.
# O deploy é feito pelo GitHub Actions (.github/workflows/whatsapp.yml);
# o id do KV abaixo é preenchido lá automaticamente.
name = "lovablex-whatsapp"
main = "src/worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "DADOS"
id = "KV_ID_AQUI"

[triggers]
crons = ["*/5 * * * *"]

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
NOME_DONO = "João"
MODELO = "claude-opus-5-5"
ESFORCO = "low"
EVOLUTION_INSTANCIA = "joao"     # o nome que você deu à instância no Evolution
AUTO_RESPOSTA = "sim"            # "nao" = o robô só faz disparos e não responde ninguém
PAUSA_HORAS = "12"               # quando você responde alguém, o robô fica quieto com ele por X horas
HORA_INICIO = "8"                # disparos só entre 8h…
HORA_FIM = "20"                  # …e 20h (Brasília)
LOTE = "4"                       # mensagens por rodada (a cada 5 minutos)
LIMITE_DIA = "80"                # máximo de disparos por dia
RADAR_URL = "https://raw.githubusercontent.com/joaoaleximoveisap-web/lovablex-celular/main/radar/data/londrina.json"

[observability]
enabled = true
